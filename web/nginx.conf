server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx's 60s default is too short for AI calls: api/app/gemini.py's retry wrapper alone
        # can burn ~35s of backoff on 429/503 (more likely on a free-tier key), on top of however
        # long the actual Gemini extraction takes -- without this, nginx returns 504 to the
        # browser while the backend request is often still running.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SUSE PoC Planner: copied verbatim from the sibling poc-planner/ project into this image at
    # build time (see web/Dockerfile). Without these rules, /planner and /planner/ fall through to
    # the SPA fallback below, which redirects to "/"; only /planner/index.html would be served.
    # Served from the same origin as /api, the planner can use the session cookie for its optional
    # connector (GET /api/planner/capabilities — see api/app/planner/).
    location = /planner { absolute_redirect off; return 301 /planner/; }
    location /planner/ {
        try_files $uri $uri/index.html =404;
        # Sem isto, navegadores decidem sozinhos (por heurística de Last-Modified) quando revalidar
        # um .html sem Cache-Control explícito -- visto em produção: o <iframe> de /planejar
        # (PlanPoc.tsx) ficou servindo uma versão velha deste arquivo até num Ctrl+Shift+R na aba de
        # cima, porque o hard reload do documento principal não força revalidação dos subrecursos
        # dele (o iframe é um subrecurso). JS/CSS com hash no nome (fora deste bloco) continuam
        # cacheáveis à vontade -- só o HTML de entrada precisa sempre bater no servidor.
        add_header Cache-Control "no-cache";
    }

    # Separado de `location /` de propósito: só o HTML de entrada da SPA precisa de no-cache (ver
    # comentário em /planner/ acima). Um `add_header` dentro de `location /` valeria pra TODA
    # resposta servida por ali, inclusive os JS/CSS com hash no nome -- esses devem continuar
    # cacheáveis à vontade (o próprio hash já invalida sozinho a cada build). `try_files ... /index.html`
    # faz um redirect interno que casa com este location mais específico.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
