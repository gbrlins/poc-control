<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUSE PoC Planner</title>
<style>
:root{
  --suse-dark:#0b2e2a; --suse-base:#30ba78; --suse-base2:#28a267;
  --suse-light:#9fe8c6; --suse-accent:#ff7a59; --gray-50:#f8fafc; --gray-100:#f1f5f9;
  --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-400:#94a3b8; --gray-500:#64748b;
  --gray-700:#334155; --gray-800:#1e293b; --gray-900:#0f172a;
  --red-500:#ef4444; --red-50:#fef2f2; --orange-500:#f97316; --orange-50:#fff7ed;
  --green-600:#16a34a; --green-50:#f0fdf4; --blue-500:#3b82f6; --blue-50:#eff6ff;
  --purple-500:#a855f7; --purple-50:#faf5ff;
  --ink:var(--suse-dark); --surface:#ffffff;
}
html[data-theme="dark"]{
  --gray-50:#101c19; --gray-100:#17251f; --gray-200:#223730; --gray-300:#35524a;
  --gray-400:#7d968d; --gray-500:#a2b8b0; --gray-700:#d2e3dc; --gray-800:#e3f0ea; --gray-900:#f3faf7;
  --red-500:#f87171; --red-50:#2c1618; --orange-500:#fb923c; --orange-50:#2c2013;
  --green-600:#4ade80; --green-50:#122c1f; --blue-500:#7fb0ff; --blue-50:#122236;
  --surface:#15241f; --ink:#7eecb0;
}
html[data-theme="dark"] body{background:#0b1512;}
html[data-theme="dark"] .alert-ok{border-color:#1f6b45;color:#9ff0c2;}
html[data-theme="dark"] .alert-warn{border-color:#9a5a1f;color:#ffcb94;}
html[data-theme="dark"] .alert-info{border-color:#3b5a85;color:#a9ccff;}
html[data-theme="dark"] .alert-danger{border-color:#8a3a3f;color:#ffb3b3;}
html[data-theme="dark"] .footer-bar{background:rgba(21,36,31,.88);}
html[data-theme="dark"] .product-card.selected{background:linear-gradient(180deg,var(--surface),var(--green-50));}
html[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.3);}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gray-50);color:var(--gray-900);}
.app-shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:110px;}
.header{background:linear-gradient(135deg,#0b2e2a,#133a34);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.header-inner{max-width:1280px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer;}
.brand-icon{background:var(--suse-base);padding:10px;border-radius:14px;display:flex;box-shadow:0 8px 20px rgba(48,186,120,.3);}
.brand h1{font-size:19px;font-weight:900;margin:0;letter-spacing:.02em;text-transform:uppercase;}
.brand p{font-size:10px;margin:2px 0 0;color:var(--suse-light);font-weight:700;text-transform:uppercase;letter-spacing:.15em;}
.lang-switch{display:flex;background:rgba(255,255,255,.07);padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.1);}
.lang-switch button{background:transparent;border:none;color:rgba(255,255,255,.45);font-size:11px;font-weight:900;padding:7px 12px;border-radius:999px;cursor:pointer;}
.lang-switch button.active{background:var(--suse-base);color:#fff;}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:14px;border:none;cursor:pointer;transition:transform .15s,background .15s;font-family:inherit;}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--suse-dark);color:#fff;padding:14px 26px;}
.btn-primary:hover{transform:scale(1.03);}
.btn-primary:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed;transform:none;}
.btn-outline{background:var(--surface);color:var(--gray-700);border:1px solid var(--gray-200);padding:14px 24px;}
.btn-outline:hover{background:var(--gray-50);}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;padding:10px 18px;border-radius:999px;font-size:12px;}
.btn-ghost:hover{background:rgba(255,255,255,.2);}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;}
.container{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:28px 24px 0;}
.card{background:var(--surface);border-radius:22px;border:1px solid var(--gray-100);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:28px;}
.card + .card{margin-top:20px;}
h2.section-title{font-size:24px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px;margin:0 0 6px;}
.section-sub{color:var(--gray-500);font-size:13px;margin:0 0 20px;}
.grid{display:grid;gap:18px;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
label.field-label{display:block;font-size:11px;font-weight:800;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--gray-200);border-radius:12px;font-size:13.5px;font-family:inherit;outline:none;background:var(--surface);color:var(--gray-900);transition:border .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--suse-base);box-shadow:0 0 0 3px rgba(48,186,120,.15);}
input.input-error{border-color:var(--red-500);box-shadow:0 0 0 2px rgba(239,68,68,.15);}
input.input-ok{border-color:var(--green-600);}
.field-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:16px;padding:16px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;}
.pill-ok{background:var(--green-50);color:var(--green-600);}
.pill-warn{background:var(--orange-50);color:var(--orange-500);}
.pill-off{background:var(--gray-100);color:var(--gray-400);}
.pill-bad{background:var(--red-50);color:var(--red-500);}
.cred-clear,.print-only{display:none;}
.product-card{position:relative;border-radius:20px;border:2px solid var(--gray-100);padding:20px;cursor:pointer;transition:all .15s;background:var(--surface);}
.product-card:hover{border-color:var(--suse-light);}
.product-card.selected{border-color:var(--suse-base);background:linear-gradient(180deg,var(--surface),var(--green-50));box-shadow:0 8px 20px rgba(48,186,120,.12);}
.product-card .check{position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:999px;border:2px solid var(--gray-200);display:flex;align-items:center;justify-content:center;}
.product-card.selected .check{background:var(--suse-base);border-color:var(--suse-base);color:#fff;}
.product-badge{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;background:var(--gray-100);color:var(--gray-500);padding:2px 8px;border-radius:999px;display:inline-block;margin-top:8px;}
.nav-steps{display:flex;align-items:center;justify-content:space-between;overflow-x:auto;padding:4px 4px 18px;margin-bottom:10px;gap:0;}
.nav-step{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:84px;background:none;border:none;font-family:inherit;}
.nav-circle{width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:3px solid var(--gray-200);background:var(--surface);color:var(--gray-400);font-weight:800;font-size:13px;}
.nav-step.active .nav-circle{background:var(--suse-dark);border-color:var(--suse-base);color:#fff;}
.nav-step.done .nav-circle{background:var(--suse-base);border-color:var(--suse-base);color:#fff;}
.nav-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);text-align:center;}
.nav-step.active .nav-label{color:var(--ink);}
.nav-line{flex:1;height:2px;background:var(--gray-200);margin:0 4px;align-self:flex-start;margin-top:19px;}
.nav-line.done{background:var(--suse-base);}
.footer-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:900px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border:1px solid var(--gray-100);border-radius:24px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 20px 50px -12px rgba(0,0,0,.18);z-index:90;}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-400);padding:8px 10px;border-bottom:2px solid var(--gray-100);}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
table.data-table tr:hover td{background:var(--gray-50);}
.tabs{display:flex;background:var(--gray-100);padding:5px;border-radius:16px;gap:4px;flex-wrap:wrap;}
.tab-btn{padding:9px 16px;font-size:10.5px;font-weight:900;text-transform:uppercase;border-radius:12px;border:none;background:transparent;color:var(--gray-400);cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.06);}
.badge-dot{width:8px;height:8px;border-radius:999px;display:inline-block;}
.alert{padding:14px 16px;border-radius:14px;font-size:12.5px;line-height:1.5;}
.alert-ok{background:var(--green-50);border:1px solid #bbf7d0;color:#166534;}
.alert-warn{background:var(--orange-50);border:1px solid #fed7aa;color:#9a3412;}
.alert-info{background:var(--blue-50);border:1px solid #bfdbfe;color:#1e40af;}
.alert-danger{background:var(--red-50);border:1px solid #fecaca;color:#991b1b;}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--gray-100);}
.checklist-item input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--suse-base);}
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.no-print{}
.export-menu{position:relative;}
.export-menu>summary{list-style:none;cursor:pointer;}
.export-menu>summary::-webkit-details-marker{display:none;}
.export-pop{position:absolute;right:0;top:100%;z-index:200;min-width:290px;background:var(--surface);color:var(--ink);border:1px solid var(--gray-200);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;}
.export-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:inherit;font:inherit;}
.export-item:hover{background:var(--gray-100);}
.export-item small{display:block;font-size:11px;opacity:.7;}
.install-sheet,.operator-sheet,.day-sheet{display:none;}
.day-sheet h4{margin:18px 0 6px;font-size:14px;}
.day-sheet h5{margin:0 0 4px;font-size:13px;break-after:avoid;}
.day-sub{color:var(--gray-500);font-size:12.5px;margin-bottom:6px;}
.day-params{border-collapse:collapse;margin:6px 0 10px;}
.day-params td,.day-params th{border:1px solid var(--gray-300);padding:3px 9px;font-size:12px;text-align:left;vertical-align:top;}
.day-item{border-top:2px solid var(--gray-300);padding:8px 0 12px;margin-top:12px;}
.day-item h4{margin:0 0 4px;break-after:avoid;}
.day-tag,.day-prod{font-size:10.5px;font-weight:700;color:var(--gray-500);margin-left:6px;}
.day-exp,.day-proc,.day-warn,.day-fill{font-size:12.5px;margin:4px 0;}
.day-warn{color:var(--gray-500);font-style:italic;}
.day-fill{margin-top:10px;}
.day-sheet .passo{margin:8px 0 8px 6px;padding-left:10px;border-left:3px solid var(--gray-400);}
.arch-svg{display:block;max-width:100%;height:auto;font-family:inherit;}
.arch-svg .a-t{font-size:14px;font-weight:800;fill:var(--gray-900);}
.arch-svg .a-s{font-size:12px;fill:var(--gray-500);}
.grp-row{background:var(--gray-50);}
.test-filters{position:sticky;top:78px;z-index:60;}
select.t-compact,input.t-compact{padding:7px 9px;font-size:12px;border-radius:10px;}
.test-filters select.t-compact,.test-filters input.t-compact{width:auto;flex:1 1 130px;min-width:110px;max-width:200px;}
.text-muted{color:var(--gray-500);}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
.flex{display:flex;}
.flex-wrap{flex-wrap:wrap;}
.gap-2{gap:8px;}.gap-3{gap:12px;}.gap-4{gap:16px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.mt-1{margin-top:6px;}.mt-2{margin-top:10px;}.mt-3{margin-top:16px;}.mt-4{margin-top:22px;}
.mb-2{margin-bottom:10px;}.mb-3{margin-bottom:16px;}
.w-full{width:100%;}
.text-xs{font-size:11px;}.text-sm{font-size:12.5px;}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media screen and (max-width:720px){
  .header-inner{padding:12px 16px;gap:10px;}
  .header-inner > div:last-child{flex-wrap:wrap;gap:8px;}
  table.data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .footer-bar{width:calc(100% - 20px);padding:8px 10px;gap:6px;bottom:10px;}
  .footer-bar .btn{padding:10px 12px;}
  .footer-bar .btn-primary{padding:10px 14px;}
  .footer-bar div[style*="width:140px"]{width:56px !important;}
}
@media print{
  /* PDF sempre em papel branco, sem fundo e sem a barra do app, qualquer que seja o tema da tela.
     As cores dos selos de status e a figura da arquitetura continuam — elas carregam significado. */
  html,html[data-theme="dark"]{
    --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1; --gray-400:#94a3b8; --gray-500:#64748b;
    --gray-700:#334155; --gray-800:#1e293b; --gray-900:#0f172a;
    --red-500:#ef4444; --red-50:#fef2f2; --orange-500:#f97316; --orange-50:#fff7ed;
    --green-600:#16a34a; --green-50:#f0fdf4; --blue-500:#3b82f6; --blue-50:#eff6ff;
    --surface:#ffffff; --ink:#0b2e2a;
  }
  html,html[data-theme="dark"] body,body{background:#fff !important;color:#0f172a;}
  html[data-theme="dark"] .alert-ok{border-color:#bbf7d0;color:#166534;}
  html[data-theme="dark"] .alert-warn{border-color:#fed7aa;color:#9a3412;}
  html[data-theme="dark"] .alert-info{border-color:#bfdbfe;color:#1e40af;}
  html[data-theme="dark"] .alert-danger{border-color:#fecaca;color:#991b1b;}
  .no-print,.header,.footer-bar,.test-filters{display:none !important;}
  .app-shell{padding-bottom:0;}
  .container{padding-top:0;}
  .card,html[data-theme="dark"] .card{background:transparent;}
  .grp-row{background:transparent !important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .card{page-break-inside:avoid;box-shadow:none;border:1px solid var(--gray-200);}
  .report-main .card{page-break-inside:auto;}
  .report-main .card.keep-together{page-break-inside:avoid;break-inside:avoid;}
  /* Paginação do PDF: título nunca fica sozinho no fim da página, tabelas curtas não se partem, e as
     longas quebram só entre linhas (com o cabeçalho repetido). */
  .report-main h3,.report-main h4{break-after:avoid;page-break-after:avoid;}
  .report-main :is(div,p):has(+ table){break-after:avoid;page-break-after:avoid;}
  .report-main table.data-table:not(.multi):not(:has(tbody tr:nth-child(15))){break-inside:avoid;page-break-inside:avoid;}   /* .multi = várias <tbody>, onde esta contagem não vale */
  .report-main table.data-table tr{break-inside:avoid;page-break-inside:avoid;}
  .report-main tbody.keep-head{break-inside:avoid;page-break-inside:avoid;}
  table.data-table tr{page-break-inside:avoid;}
  table.data-table thead{display:table-header-group;}
  .nav-steps{display:none !important;}
  /* Credenciais só saem na folha do operador, nunca no relatório do cliente. */
  body.print-operator .report-main,body.print-install .report-main,body.print-day .report-main{display:none;}
  body.print-install .install-sheet,body.print-operator .operator-sheet,body.print-day .day-sheet{display:block;}
  body.print-day .day-sheet .proc-body pre{white-space:pre-wrap;word-break:break-word;overflow:visible;}
  body.print-day .day-sheet .proc-body table{display:table;}
  body.print-operator .cred-mask{display:none;}
  body.print-operator .cred-clear{display:inline;}
  body.print-operator h3.print-only{display:block;}
}
.proc-body{font-size:13.5px;line-height:1.55;}
.proc-body table{border-collapse:collapse;margin:8px 0;max-width:100%;display:block;overflow-x:auto;}
.proc-body th,.proc-body td{border:1px solid var(--gray-200);padding:4px 8px;text-align:left;vertical-align:top;font-size:12.5px;}
.proc-body pre{background:var(--gray-100);padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;}
.proc-body code,.proc-body kbd,.proc-body samp{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;}
.proc-body blockquote{margin:8px 0;padding-left:12px;border-left:3px solid var(--gray-300);}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ======================================================================
   SUSE PoC Planner — single-file offline wizard
   ====================================================================== */

/* ---------------- ICONS (minimal inline SVG set) ---------------- */
const ICONS = {

  plus:'<path d="M12 5v14M5 12h14"/>',

  info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7h.01"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 000-9 6 6 0 00-11.3-2A5 5 0 007 18.9"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  shuffle:'<path d="M3 16h3l6-10h6M3 7h3l2.5 4M18 3l3 3-3 3M18 22l3-3-3-3"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20"/>',

/* Requisitos de hardware do SUSE Virtualization, por nó: coluna "testes" (mínimo) e coluna "produção".
   Os números são os mesmos nas docs v1.7 e v1.8 (conferido) e no SUSE Virtualization PoC Guide v1.7.0 §7.1. */
/* `min` e `prod` são os pisos da documentação e continuam dirigindo os avisos. `sug` é o que o planejador SUGERE (padrão do campo):
   folga confortável acima de produção para o hardware nunca ser o problema da PoC — CPU ×1,5, RAM ×2, disco ×2, em números redondos
   (disco por nó nunca abaixo de 1 TB). Nunca é usado para aprovar ou reprovar: abaixo de `sug` e acima de `prod` continua "ok". */
const VIRT_SIZING = { min:{cpu:8, ram:32, disk:250}, prod:{cpu:16, ram:64, disk:500}, sug:{cpu:24, ram:128, disk:1000}, nic:{min:'1G', prod:'10G'}, nodes:3 };
/* Abaixo do mínimo de testes = gap; entre o mínimo e produção = "a confirmar"; em produção ou acima = ok. */
function virtSpecStatus(inf){
  const dims=[['cpuCores','cpu','CPU'],['ramGb','ram','RAM'],['diskGb','disk','disk']], z=VIRT_SIZING;
  const below=dims.filter(d=>Number(inf[d[0]])<z.min[d[1]]).map(d=>d[2]);
  const belowProd=dims.filter(d=>Number(inf[d[0]])>=z.min[d[1]] && Number(inf[d[0]])<z.prod[d[1]]).map(d=>d[2]);
  const nodesOk=Number(inf.nodeCount)>=z.nodes;
  return { status:(below.length||!nodesOk)?'gap':(belowProd.length?'confirm':'ok'), below:below, belowProd:belowProd, nodesOk:nodesOk };
}
/* A documentação acompanha a versão alvo quando ela foi conferida (1.7 e 1.8); fora disso usa a 1.7. */
function virtDocsVersion(){ const m=/^v?1\.(\d+)/.exec(String(state.virtInstall.targetVersion||'').trim()); return (m && (m[1]==='7'||m[1]==='8')) ? 'v1.'+m[1] : 'v1.7'; }
function docVirt(){ return 'https://documentation.suse.com/cloudnative/virtualization/'+virtDocsVersion()+'/en/'; }
/* Só a linha Prime é alvo; a comunitária (patch .0) não. Tabela conferida em 2026-10-23 em https://www.suse.com/lifecycle/#suse-virtualization:
   uma linha fora dela (ex.: 1.9.1) vira "a confirmar", nunca erro — atualize aqui quando sair um Prime novo. */
const VIRT_PRIME = { '1.8':{latest:2, eol:'29 Dec 2027'}, '1.7':{latest:3, eol:'9 Aug 2027'} };
function virtPrimeLatest(){ const k=Object.keys(VIRT_PRIME).sort((a,b)=>parseFloat(b.slice(2))-parseFloat(a.slice(2)))[0]; return 'v'+k+'.'+VIRT_PRIME[k].latest; }
function virtPrimeStatus(){
  const m=/^v?1\.(\d+)\.(\d+)$/.exec(String(state.virtInstall.targetVersion||'').trim()); if(!m) return null;
  const minor=m[1], patch=+m[2], lc=VIRT_PRIME['1.'+minor];
  if(patch===0) return {st:'gap', key:'community'};
  if(!lc) return {st:'confirm', key:'unlisted'};
  if(minor==='7') return {st:'confirm', key:'old', eol:lc.eol};
  return patch>=lc.latest ? {st:'ok', key:'ok', eol:lc.eol} : {st:'confirm', key:'patch', eol:lc.eol};
}
function virtVersionChecked(){ return /^v?1\.(7|8)(\.\d+)?$/.test(String(state.virtInstall.targetVersion||'').trim()); }

/* Compara as dimensões de uma VM com o mínimo/recomendado do perfil. */
function sizingStatusOf(z, vm){
  const dims=[['cpu','vCPU'],['ram','RAM'],['disk','disk']];
  const below=dims.filter(d=>Number(vm[d[0]])<z.min[d[0]]).map(d=>d[1]);
  const belowRec=z.rec ? dims.filter(d=>Number(vm[d[0]])<z.rec[d[0]]).map(d=>d[1]) : [];
  return { status: below.length ? 'gap' : (belowRec.length ? 'confirm' : 'ok'), below:below, belowRec:belowRec };

function netHosts(){
  const sp=state.selectedProducts, n=state.network, vn=state.virtNet, vi=state.virtInstall, ap=state.installApproach;

    if(sp.rancher) add('node','on-rreg','registry.rancher.com','443','TCP',T('Imagens do Rancher Prime','Rancher Prime images','Imágenes de Rancher Prime'));
    if(sp.registry||sp.observability||sp.security||sp.storage) add('node','on-sreg','registry.suse.com','443','TCP',T('Imagens e charts SUSE (Private Registry, Observability); espelho do registries.yaml','SUSE images and charts (Private Registry, Observability); registries.yaml mirror','Imágenes y charts SUSE (Private Registry, Observability); espejo de registries.yaml'));
    if(sp.rancher||sp.storage||sp.security) add('node','on-docker',['registry-1.docker.io','auth.docker.io','production.cloudflare.docker.com'],'443','TCP',T('Docker Hub: imagens base e do Longhorn (token, manifestos e camadas)','Docker Hub: base and Longhorn images (token, manifests and layers)','Docker Hub: imágenes base y de Longhorn (token, manifiestos y capas)'));
    if(sp.storage||sp.security) add('node','on-oss',['charts.longhorn.io','neuvector.github.io'],'443','TCP',T('Repositórios Helm do Longhorn e do NeuVector','Longhorn and NeuVector Helm repositories','Repositorios Helm de Longhorn y NeuVector'));

    if(sp.rancher||sp.registry||sp.observability) add('node','on-le',['acme-v02.api.letsencrypt.org','r3.o.lencr.org'],'443 / 80','TCP',T('Só se o certificado vier do Let’s Encrypt (ACME e OCSP, este na porta 80)','Only if the certificate comes from Let’s Encrypt (ACME and OCSP, the latter on port 80)','Solo si el certificado viene de Let’s Encrypt (ACME y OCSP, este en el puerto 80)'),{optional:true});
  }
  /* servidores e serviços alcançados em qualquer abordagem */
  const ntp=(n.ntpServers||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(anyEib||sp.virtualization||sp.manager) add('node','ntp',ntp.length?ntp:['NTP'],'123','UDP',T('Sincronismo de hora: relógio errado derruba certificados e o quórum do etcd. Em air-gap use um NTP interno','Time sync: a wrong clock breaks certificates and the etcd quorum. In air-gap use an internal NTP','Sincronía de hora: un reloj errado rompe certificados y el quórum de etcd. En air-gap use un NTP interno'));
  if(sp.virtualization){
    if(sp.rancher){ const r=n.vms.find(m=>m.product==='rancher'); add('node','virt-rancher',r&&r.hostname?r.hostname+(n.domain?'.'+n.domain:''):'Rancher (LB)','443','TCP',T('Nós do Virtualization → Rancher, para o cluster ser gerenciável (guia §7.2.2)','Virtualization nodes → Rancher, so the cluster is manageable (guide §7.2.2)','Nodos de Virtualization → Rancher, para que el clúster sea gestionable (guía §7.2.2)')); }
    if(connected) add('node','virt-upgrade','releases.rancher.com','443','TCP',T('Upgrade do Virtualization: version.yaml e o ISO (em air-gap, hospede o ISO e o version.yaml internamente)','Virtualization upgrade: version.yaml and the ISO (in air-gap, host the ISO and version.yaml internally)','Upgrade de Virtualization: version.yaml y el ISO (en air-gap, hospede el ISO y version.yaml internamente)'),{optional:true,src:'https://documentation.suse.com/cloudnative/virtualization/v1.8/en/upgrades/upgrades.html'});
    const bk=vn.backup; if(bk.type && bk.type!=='none' && bk.endpoint) add('node','virt-backup',urlHost(bk.endpoint)||bk.endpoint,bk.type==='nfs'?'2049':'443','TCP',T('Alvo de backup ('+bk.type.toUpperCase()+') alcançado pelos nós','Backup target ('+bk.type.toUpperCase()+') reached by the nodes','Destino de backup ('+bk.type.toUpperCase()+') alcanzado por los nodos'));

  if(sp.manager && connected){
    const mdoc='https://documentation.suse.com/multi-linux-manager/5.1/en/docs/installation-and-upgrade/network-requirements.html';
    add('server','mlm-scc','scc.suse.com','80 / 443','TCP',T('SUSE Customer Center: registro, produtos e repositórios (a 80 não serve a Web UI)','SUSE Customer Center: registration, products and repositories (port 80 does not serve the Web UI)','SUSE Customer Center: registro, productos y repositorios (el 80 no sirve la Web UI)'),{src:mdoc});

    add('server','mlm-3rd',['download.nvidia.com','public.dhe.ibm.com','nu.novell.com'],'443','TCP',T('Só para clientes que usam esses produtos de terceiros','Only for clients that use those third-party products','Solo para clientes que usan esos productos de terceros'),{optional:true,src:mdoc});
  }
  if(n.hasProxy && out.length) add('node','proxy',(n.httpProxy||n.httpsProxy||'').replace(/^https?:\/\//,'').replace(/[\/:].*$/,'')||'Proxy','—','TCP',T('O proxy precisa liberar CONNECT na 443 (e 80 quando indicado) para os hosts acima','The proxy must allow CONNECT on 443 (and 80 where noted) to the hosts above','El proxy debe permitir CONNECT en el 443 (y 80 donde se indique) hacia los hosts anteriores'));
  return out;
}

function installWhen(key){
  const n=state.network, vn=state.virtNet, sp=state.selectedProducts;
  switch(key){
    case 'multinode': return state.infra.virtualization.nodeCount >= 2;

    case 'connected': return !n.hasAirGap;

    case 'eib2': return eibProfiles().indexOf(2)>=0;

    case 'eibany': return eibProfiles().length>0;
    default: return true;
  }

function installApplies(s){
  const sp = state.selectedProducts;
  if(s.products && s.products.length){ const f=(x)=>!!sp[x]; if(!(s.all ? s.products.every(f) : s.products.some(f))) return false; }

}

}

function urlHasSecret(u){ return /^(?:[a-z][a-z0-9+.-]*:\/\/)?[^\/?#\s]*@/i.test(String(u||'').trim()) || /[?&](token|key|secret|password|passwd|pass|sig|signature)=/i.test(String(u||'')); }
function urlShown(u,g){ u=String(u||'').trim(); if(!u) return '—'; return urlHasSecret(u) ? urlHost(u)+'/… ('+g('contém credencial — fica na folha do operador','contains a credential — kept on the operator sheet','contiene una credencial — queda en la hoja del operador')+')' : u; }

function deepMerge(def, src){
  if(!isPlainObject(src)) return def;

    if(isPlainObject(def[k]) && isPlainObject(src[k])) out[k] = Object.keys(def[k]).length ? deepMerge(def[k], src[k]) : src[k];

function stepMissingCount(step){
  const s = state; const sel = s.selectedProducts;
  const countEmpty = (vals) => vals.filter(v => !v || !String(v).trim()).length;
  switch(step){
    case 'project':
      return countEmpty([s.project.projectName, s.project.leadEngineer, s.project.leadEmail, s.project.clientOrganization]);
    case 'network':
      return countEmpty([s.network.managementCidr, s.network.gatewayIp, s.network.clusterVip, s.network.ipPoolStart, s.network.ipPoolEnd])
        + (sel.virtualization ? countEmpty([s.virtNet.mgmtNics, s.virtNet.vmNics, s.virtNet.nicSpeed, s.virtNet.ipMode, s.virtNet.backup.type]) : 0);
    case 'credentials': {
      const req = [];
      if(sel.rancher) req.push(s.credentials.rancherBootstrapPassword, s.credentials.appCollectionUser, s.credentials.appCollectionToken);
      if(sel.security||sel.storage||sel.registry||sel.observability) req.push(s.credentials.sccUser, s.credentials.sccPassword);
      if(sel.observability) req.push(s.credentials.observabilityPassword, s.credentials.stackstateLicense);
      if(sel.registry) req.push(s.credentials.privateRegistryAdminPassword);
      if(sel.security) req.push(s.credentials.neuvectorAdminPassword);
      if(sel.manager) req.push(s.credentials.managerActivationKey);
      if(sel.virtualization) req.push(s.credentials.virtualizationClusterToken);
      if(sel.rancher && (s.virtNet.auth.provider==='ad'||s.virtNet.auth.provider==='ldap')) req.push(s.credentials.directoryBindPassword);
      return countEmpty(req);
    }
    default: return 0;
  }
}

/* ======================================================================
   BIBLIOTECA DE PROCEDIMENTOS — runbooks em HTML, 100% local (localStorage), sem servidor.
   Formato e metadados seguem o poc-control (h2/h3 viram seções; status rascunho|validado; versão),
   para a biblioteca poder ser trocada com ele sem conversão (docs/design-unification.md, seção 4).

   O HTML importado é tratado como hostil (regra R5): o localStorage desta página guarda senhas de
   root, SCC e AC. Por isso nada do que é importado é guardado nem exibido como veio: um parser
   próprio (sem DOMParser, para rodar igual no Node dos testes) monta uma árvore e a reescreve só
   com tags e atributos de uma lista de permissão. Scripts, estilos, iframes, imagens, formulários,
   atributos on*, class/style e links que não sejam http(s)/mailto/# não sobrevivem.
   ====================================================================== */
const LIBRARY_KEY = 'suse_poc_planner_procedures';
const LIBRARY_KIND = 'suse-poc-procedure-library';
const LIBRARY_SCHEMA = 1;
const PROC_MAX_BYTES = 1500000;          // por arquivo HTML importado
const PROC_STATUS = ['rascunho','validado'];
const PROC_STATUS_LABEL = { rascunho:{pt:'Rascunho',en:'Draft',es:'Borrador'}, validado:{pt:'Validado',en:'Validated',es:'Validado'} };

/* ---- HTML -> árvore (tolerante; só o que runbooks usam) ---- */
const HTML_VOID = ['br','hr','img','input','meta','link','col','wbr','area','base','source','track','embed','param'];
const HTML_RAW = ['script','style'];
const HTML_DROP = ['script','style','iframe','object','embed','noscript','template','svg','math','head','title','form','select','textarea','button','canvas','audio','video','applet','frame','frameset','img','input','meta','link','base','param','source','track','area'];
const HTML_ALLOW = ['h1','h2','h3','h4','h5','h6','p','ul','ol','li','table','thead','tbody','tfoot','tr','th','td','caption','pre','code','kbd','samp','strong','b','em','i','u','sub','sup','small','br','hr','a','blockquote','dl','dt','dd'];
const HTML_BLOCK = ['h1','h2','h3','h4','h5','h6','p','ul','ol','table','pre','blockquote','dl','hr'];
const HTML_STRUCT = ['ul','ol','table','thead','tbody','tfoot','tr','dl'];
const HTML_IMPLICIT = { li:['li'], p:['p'], td:['td','th'], th:['td','th'], tr:['td','th','tr'], dt:['dt','dd'], dd:['dt','dd'] };
const HTML_ENT = { amp:'&', lt:'<', gt:'>', quot:'"', apos:"'", nbsp:' ', mdash:'—', ndash:'–', hellip:'…', laquo:'«', raquo:'»', copy:'©', reg:'®', rarr:'→', larr:'←', bull:'•', middot:'·', times:'×', deg:'°' };
function htmlDecode(s){
  return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z][a-z0-9]*);/gi, (m,e)=>{
    if(e[0]==='#'){
      const cp = e[1]==='x'||e[1]==='X' ? parseInt(e.slice(2),16) : parseInt(e.slice(1),10);
      try{ return (cp>0 && cp<0x110000 && !(cp>=0xd800 && cp<=0xdfff)) ? String.fromCodePoint(cp) : m; }catch(x){ return m; }
    }
    const v = HTML_ENT[e.toLowerCase()];
    return v===undefined ? m : v;
  });
}
function htmlAttrs(s){
  const a = Object.create(null), re = /([^\s=\/"'<>]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g; let m;
  while((m = re.exec(s))){ const k = m[1].toLowerCase(); if(!(k in a)) a[k] = htmlDecode(m[2]!=null ? m[2] : m[3]!=null ? m[3] : m[4]!=null ? m[4] : ''); }
  return a;
}
function htmlParse(src){
  const root = { name:'#root', attrs:Object.create(null), children:[] }, stack = [root], top = ()=>stack[stack.length-1];
  const tagRe = /<(\/?)([a-zA-Z][a-zA-Z0-9:-]*)((?:"[^"]*"|'[^']*'|[^'">])*)>/y, low = src.toLowerCase(), n = src.length;
  let i = 0;
  while(i<n){
    const lt = src.indexOf('<', i);
    if(lt<0){ top().children.push({t:'text', v:htmlDecode(src.slice(i))}); break; }
    if(lt>i) top().children.push({t:'text', v:htmlDecode(src.slice(i,lt))});
    if(src.startsWith('<!--', lt)){ const e = src.indexOf('-->', lt+4); i = e<0 ? n : e+3; continue; }
    if(src[lt+1]==='!' || src[lt+1]==='?'){ const e = src.indexOf('>', lt); i = e<0 ? n : e+1; continue; }
    tagRe.lastIndex = lt; const m = tagRe.exec(src);
    if(!m){ top().children.push({t:'text', v:'<'}); i = lt+1; continue; }
    i = lt + m[0].length;
    const closing = m[1]==='/', name = m[2].toLowerCase(), rest = m[3];
    if(closing){ for(let k=stack.length-1; k>0; k--){ if(stack[k].name===name){ stack.length = k; break; } } continue; }
    if(HTML_RAW.indexOf(name)>=0){ const idx = low.indexOf('</'+name, i); if(idx<0){ i = n; } else { const e = src.indexOf('>', idx); i = e<0 ? n : e+1; } continue; }
    const imp = HTML_IMPLICIT[name]; if(imp){ while(stack.length>1 && imp.indexOf(top().name)>=0) stack.pop(); }
    const node = { name:name, attrs:htmlAttrs(rest), children:[] };
    top().children.push(node);
    /* Profundidade limitada: milhares de tags abertas e nunca fechadas estourariam a pilha nas passagens recursivas. */
    if(HTML_VOID.indexOf(name)<0 && !/\/\s*$/.test(rest) && stack.length<150) stack.push(node);
  }
  return root;
}
function htmlSafeHref(v){
  const s = String(v==null?'':v).replace(/[\u0000- \u007f-\u009f]+/g,'');
  return /^(https?:\/\/|mailto:|#)/i.test(s) ? s : null;
}
function htmlSafeAttrs(name, a){
  const o = {};
  if(name==='a'){ const h = htmlSafeHref(a.href); if(h) o.href = h; }
  if((name==='td'||name==='th')){ ['colspan','rowspan'].forEach(k=>{ if(/^\d{1,2}$/.test(a[k]||'')) o[k] = a[k]; }); }
  if(name==='ol' && /^\d{1,4}$/.test(a.start||'')) o.start = a.start;
  return o;
}
/* Descarta o que não é permitido: tags da lista de descarte somem com o conteúdo; as demais fora da lista de permissão
   são "desembrulhadas" (o texto fica). */
function htmlClean(children, inPre, inHead){
  const out = [], sp = { t:'text', v:' ' };
  children.forEach(c=>{
    if(c.t==='text'){ out.push(c); return; }
    const nm = c.name;
    if(HTML_DROP.indexOf(nm)>=0) return;
    if(HTML_ALLOW.indexOf(nm)>=0) out.push({ name:nm, attrs:htmlSafeAttrs(nm,c.attrs), children:htmlClean(c.children, inPre||nm==='pre', inHead||/^h[1-6]$/.test(nm)) });
    /* Em títulos, "<h2>Título<span>sub</span></h2>" é comum e só o CSS separa os dois: ao desembrulhar o span entra um espaço. Em <pre> nunca
       (código com realce de sintaxe usa spans colados), e fora de títulos também não. */
    else if(inHead && !inPre){ out.push(sp); htmlClean(c.children, inPre, inHead).forEach(x=>out.push(x)); out.push(sp); }
    else htmlClean(c.children, inPre, inHead).forEach(x=>out.push(x));
  });
  return out;
}
function htmlOut(nodes, inPre, parent){
  return nodes.map(n=>{
    if(n.t==='text'){
      let v = n.v;
      if(!inPre){ if(HTML_STRUCT.indexOf(parent)>=0 && !v.trim()) return ''; v = v.replace(/\s+/g,' '); }
      return esc(v);
    }
    if(HTML_VOID.indexOf(n.name)>=0) return '<'+n.name+'>';
    let at = '';
    Object.keys(n.attrs).forEach(k=>{ at += ' '+k+'="'+esc(n.attrs[k])+'"'; });
    if(n.name==='a' && n.attrs.href) at += ' target="_blank" rel="noopener noreferrer"';
    return '<'+n.name+at+'>'+htmlOut(n.children, inPre||n.name==='pre', n.name)+'</'+n.name+'>';
  }).join('');
}
function sanitizeHtml(src){ return htmlOut(htmlClean(htmlParse(String(src==null?'':src)).children, false), false, '#root').trim(); }
function nodesText(nodes){
  let s = '';
  (function walk(list){ list.forEach(n=>{
    if(n.t==='text'){ s += n.v; return; }
    if(n.name==='br'){ s += '\n'; return; }
    walk(n.children);
    if(HTML_BLOCK.indexOf(n.name)>=0 || ['li','tr','dt','dd','caption'].indexOf(n.name)>=0) s += '\n';
    else if(n.name==='td'||n.name==='th') s += ' ';
  }); })(nodes);
  return s.replace(/[ \t ]+/g,' ').replace(/ ?\n ?/g,'\n').replace(/\n{2,}/g,'\n').trim();
}
/* Divide em seções como o poc-control (html_processing.py): h1 é o título do documento; h2/h3 abrem seção; o resto do conteúdo
   entra na seção corrente. Conteúdo antes do primeiro h2 vira "Visão geral". Seção sem conteúdo não é criada. */
function procSections(html){
  const tree = htmlClean(htmlParse(String(html||'')).children, false), blocks = []; let buf = [];
  const flushInline = ()=>{ if(buf.some(x=>x.t ? x.v.trim() : true)) blocks.push({ name:'p', attrs:{}, children:buf }); buf = []; };
  tree.forEach(n=>{ if(!n.t && HTML_BLOCK.indexOf(n.name)>=0){ flushInline(); blocks.push(n); } else buf.push(n); });
  flushInline();
  const secs = []; let cur = { level:2, title:'Visão geral', parent:null, nodes:[] }, h2 = null, docTitle = '';
  const flush = ()=>{ if(cur.nodes.length) secs.push({ level:cur.level, title:cur.title, parent:cur.parent, order:secs.length, html:htmlOut(cur.nodes,false,'#root').trim(), text:nodesText(cur.nodes) }); };
  blocks.forEach(b=>{
    if(b.name==='h1'){ if(!docTitle) docTitle = nodesText([b]); return; }
    if(b.name==='h2' || b.name==='h3'){ flush(); const t = nodesText([b]); cur = { level:b.name==='h2'?2:3, title:t, parent:b.name==='h3'?h2:null, nodes:[] }; if(b.name==='h2') h2 = t; return; }
    cur.nodes.push(b);
  });
  flush();
  return { title:docTitle, sections:secs };
}

/* ---- modelo, versões e armazenamento ---- */
const PROC_PRODUCT_HINTS = {
  virtualization:/harvester|suse virtualization|kubevirt|virtual machine|máquina virtual|maquina virtual/i,
  rancher:/rancher|\brke2?\b|\bk3s\b|fleet/i,
  security:/neuvector|suse security/i,
  storage:/longhorn|suse storage/i,
  observability:/observability|stackstate/i,
  registry:/harbor|private registry/i,
  appcollection:/application collection|dp\.apps\.rancher\.io/i,
  manager:/multi-linux manager|suse manager|uyuni/i
};
function guessProducts(text){ return Object.keys(PROC_PRODUCT_HINTS).filter(id=>PROC_PRODUCT_HINTS[id].test(text||'')); }
function procSafeId(v){ return (typeof v==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(v)) ? v : uid(); }
function procClampStr(v, max){ return (typeof v==='string' ? v : '').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').slice(0,max); }
/* Normaliza um registro vindo do armazenamento ou de um arquivo importado. Com sanitize, o HTML é reescrito (arquivo importado nunca é confiável). */
function procNormalize(o, sanitize){
  if(!isPlainObject(o)) return null;
  const html = sanitize ? sanitizeHtml(o.html) : (typeof o.html==='string' ? o.html : '');
  const id = procSafeId(o.id);
  const prodIds = PRODUCTS.map(p=>p.id);
  const tags = (Array.isArray(o.tags) ? o.tags : []).filter(t=>typeof t==='string' && t.trim()).map(t=>procClampStr(t.trim(),40)).filter((t,i,a)=>t && a.indexOf(t)===i).slice(0,30);
  const v = parseInt(o.version,10);
  return {
    id:id, family:procSafeId(o.family||id), title:procClampStr(o.title,200).trim() || 'Sem título',
    products:(Array.isArray(o.products) ? o.products : []).filter(p=>prodIds.indexOf(p)>=0).filter((p,i,a)=>a.indexOf(p)===i),
    tags:tags, sourceClient:procClampStr(o.sourceClient,120), date:/^\d{4}-\d{2}-\d{2}$/.test(o.date||'') ? o.date : '',
    status:PROC_STATUS.indexOf(o.status)>=0 ? o.status : 'rascunho', version:v>0 ? v : 1, html:html,
    placeholders:phNormalize(o.placeholders), authored:isPlainObject(o.authored) ? draftNormalize(o.authored) : null
  };
}
function loadLibrary(){
  try{ const o = JSON.parse(localStorage.getItem(LIBRARY_KEY)||'null'); if(o && Array.isArray(o.procedures)) return o.procedures.map(p=>procNormalize(p,false)).filter(Boolean); }catch(e){}
  return [];
}
/* Devolve null se gravou, 'quota' se o localStorage estourou (~5 MB por origem, divididos com os projetos), ou 'error'. Nunca lança. */
function saveLibrary(list){
  try{ localStorage.setItem(LIBRARY_KEY, JSON.stringify({ schema:LIBRARY_SCHEMA, procedures:list })); return null; }
  catch(e){ return isQuotaError(e) ? 'quota' : 'error'; }
}
function procFromHtml(raw, meta){
  meta = meta || {};
  const html = sanitizeHtml(raw), parsed = procSections(html);
  const fromName = String(meta.filename||'').replace(/\.[^.]*$/,'').replace(/[_-]+/g,' ').trim();
  const id = uid();
  return procNormalize({
    id:id, family:id, title:meta.title || parsed.title || fromName || 'Sem título', date:todayISO(), status:'rascunho', version:1, html:html,
    products:guessProducts(parsed.title+' '+parsed.sections.map(s=>s.title).join(' ')+' '+fromName), tags:[], sourceClient:''
  }, false);
}
/* Mesmo título (sem diferenciar caixa) = nova versão da mesma família; as anteriores continuam na biblioteca. */
function libraryAdd(list, p){
  const key = p.title.trim().toLowerCase(), same = list.filter(x=>x.title.trim().toLowerCase()===key);
  if(same.length){ p.family = same[0].family; p.version = Math.max.apply(null, same.map(x=>x.version)) + 1; }
  return list.concat([p]);
}
/* Núcleo testável da importação de HTML (a leitura dos arquivos fica em P.libImportHtml). entries: [{name,text}] */
function libraryImportHtmlFiles(entries){
  let list = loadLibrary(); const res = { added:[], rejected:[] };
  (entries||[]).forEach(e=>{
    if(!e || typeof e.text!=='string'){ res.rejected.push({ name:e&&e.name, reason:'read' }); return; }
    if(e.text.length>PROC_MAX_BYTES){ res.rejected.push({ name:e.name, reason:'size' }); return; }
    const p = procFromHtml(e.text, { filename:e.name });
    if(!procSections(p.html).sections.length){ res.rejected.push({ name:e.name, reason:'empty' }); return; }
    list = libraryAdd(list, p); res.added.push(p);
  });
  if(res.added.length){ const err = saveLibrary(list); if(err){ res.error = err; res.added = []; } }
  return res;
}
function libraryExportObject(){ return { kind:LIBRARY_KIND, schema:LIBRARY_SCHEMA, exportedAt:new Date().toISOString(), procedures:loadLibrary() }; }
/* Importa uma biblioteca exportada. Cada HTML é reescrito; ids que já existem são ignorados (reimportar é seguro). */
function libraryImportData(data){
  const res = { added:0, skipped:0, invalid:0 };
  const items = Array.isArray(data) ? data : (isPlainObject(data) && Array.isArray(data.procedures) ? data.procedures : null);
  if(!items){ res.invalid = 1; res.notLibrary = true; return res; }
  let list = loadLibrary(); const ids = new Set(list.map(p=>p.id));
  items.forEach(o=>{
    const p = procNormalize(o, true);
    if(!p || !procSections(p.html).sections.length){ res.invalid++; return; }
    if(ids.has(p.id)){ res.skipped++; return; }
    ids.add(p.id); list = list.concat([p]); res.added++;
  });
  if(res.added){ const err = saveLibrary(list); if(err){ res.error = err; res.added = 0; } }
  return res;
}

/* ---- escrever procedimentos e placeholders (ADR 8) ----
   Um placeholder é `<MAIUSCULAS_COM_UNDERSCORE>` no texto (como já está nos runbooks). Cada procedimento pode DECLARAR os dele
   (`placeholders`: nome, descrição, exemplo, fonte). Na hora de imprimir o roteiro do dia, um placeholder declarado é trocado pelo valor do
   projeto (VIP, CIDR, IP de uma VM...) ou pelo valor da sessão guardado no vínculo do teste (`procValues`). Regra firme: um nome com cara
   de segredo (TOKEN, SENHA, USUARIO...) NUNCA é trocado, de nenhuma fonte; fica como o literal `<NOME>` para a pessoa digitar na sessão.
   O formulário gera o HTML padrão (mesmos títulos dos runbooks) e a saída passa pelo sanitizador como qualquer outro procedimento. */
const PH_NAME_RE = /^[A-Z][A-Z0-9_]{0,39}$/;
const PH_SECRET_WORDS = ['TOKEN','SENHA','PASSWORD','PASSWD','PWD','PASS','SECRET','SEGREDO','KEY','CHAVE','USUARIO','USER','LOGIN','CRED','CREDENCIAL','CREDENCIAIS','LICENSE','LICENCA','COOKIE','BEARER'];
const PH_SECRET_ENDS = ['TOKEN','KEY','SECRET','PASSWORD','SENHA'];
function phIsSecretName(name){
  return String(name||'').split('_').some(w=>PH_SECRET_WORDS.indexOf(w)>=0 || PH_SECRET_ENDS.some(e=>w.length>e.length && w.slice(-e.length)===e));
}
const PH_PROJECT_SOURCES = ['vip','cidr','gateway','poolStart','poolEnd','domain','dns','ntp','client'];
const PH_VM_PRODUCTS = ['virtualization','rancher','observability','manager','addons'];
function phSourceOk(s){ return s==='session' || PH_PROJECT_SOURCES.indexOf(s)>=0 || /^vm(Ip|Host):(virtualization|rancher|observability|manager|addons)$/.test(String(s)); }
function phSourceLabel(s, g){
  const L = { session:g('valor da sessão (digitado por teste)','session value (typed per test)','valor de la sesión (escrito por prueba)'), never:g('digite na sessão (nunca preenchido)','type it during the session (never filled in)','escríbalo en la sesión (nunca se rellena)'),
    vip:g('VIP do cluster','cluster VIP','VIP del clúster'), cidr:'CIDR', gateway:'Gateway', poolStart:g('início do pool de IPs','IP pool start','inicio del pool de IPs'), poolEnd:g('fim do pool de IPs','IP pool end','fin del pool de IPs'),
    domain:g('domínio','domain','dominio'), dns:'DNS', ntp:'NTP', client:g('nome do cliente','client name','nombre del cliente') };
  const m = /^vm(Ip|Host):(.+)$/.exec(String(s));
  if(m) return (m[1]==='Ip' ? 'IP' : 'hostname') + g(' da 1ª VM de ',' of the 1st VM of ',' de la 1ª VM de ') + productOrFallback(m[2]==='addons'?'addons':m[2]).name;
  return L[s] || s;
}
function phNormalize(list){
  const seen = {}, out = [];
  (Array.isArray(list)?list:[]).forEach(r=>{
    if(out.length>=40 || !isPlainObject(r) || typeof r.name!=='string' || !PH_NAME_RE.test(r.name) || seen[r.name]) return;
    seen[r.name] = 1;
    out.push({ name:r.name, description:procClampStr(r.description,200).trim(), example:procClampStr(r.example,200).trim(),
      source: phIsSecretName(r.name) ? 'never' : (phSourceOk(r.source) ? r.source : 'session') });
  });
  return out;
}
/* Valor do projeto para uma fonte (só campos seguros, os mesmos do ambiente do roteiro; nunca credenciais nem proxy). */
function phProjectValue(src){
  const n = state.network, pr = state.project;
  const m = /^vm(Ip|Host):(.+)$/.exec(String(src));
  if(m){ rebuildVms(); const vm = (n.vms||[]).filter(v=>v.product===m[2])[0]; return vm ? String(m[1]==='Ip' ? vm.ip : vm.hostname) : ''; }
  switch(src){ case 'vip': return n.clusterVip; case 'cidr': return n.managementCidr; case 'gateway': return n.gatewayIp; case 'poolStart': return n.ipPoolStart; case 'poolEnd': return n.ipPoolEnd;
    case 'domain': return n.domain; case 'dns': return n.dnsServers; case 'ntp': return n.ntpServers; case 'client': return pr.clientOrganization; }
  return '';
}
/* Valor de um placeholder declarado para um teste, ou null se não deve/não pode ser trocado. */
function phValue(ph, t){
  if(!ph || ph.source==='never' || phIsSecretName(ph.name)) return null;
  const v = String(ph.source==='session' ? ((t && isPlainObject(t.procValues) ? t.procValues[ph.name] : '') || '') : (phProjectValue(ph.source) || '')).trim();
  return v ? v : null;
}
/* Troca, só nos nós de TEXTO do HTML já sanitizado, os placeholders declarados. O valor entra como texto e sai escapado pelo htmlOut;
   resolvido vira <b>, declarado mas sem valor vira <i> com o literal; o que não foi declarado, e o conteúdo de <kbd> (onde a tabela
   "Valores desta sessão" escreve o nome), fica como está. */
function procSubstituteHtml(html, phs, t){
  if(!Array.isArray(phs) || !phs.length) return html;
  const map = {}; phs.forEach(ph=>{ map[ph.name] = phValue(ph, t); });
  const walk = (nodes)=>{
    const out = [];
    nodes.forEach(n=>{
      if(n.t==='text'){
        let last = 0, m; const re = /<([A-Z][A-Z0-9_]{0,39})>/g;
        while((m = re.exec(n.v))){
          if(!Object.prototype.hasOwnProperty.call(map, m[1])) continue;
          if(m.index>last) out.push({ t:'text', v:n.v.slice(last, m.index) });
          out.push(map[m[1]]!=null ? { name:'b', attrs:{}, children:[{ t:'text', v:map[m[1]] }] } : { name:'i', attrs:{}, children:[{ t:'text', v:m[0] }] });
          last = m.index + m[0].length;
        }
        if(last===0) out.push(n); else if(last<n.v.length) out.push({ t:'text', v:n.v.slice(last) });
      } else if(n.name==='kbd' || !n.children){ out.push(n); }
      else out.push(Object.assign({}, n, { children:walk(n.children) }));
    });
    return out;
  };
  return htmlOut(walk(htmlClean(htmlParse(String(html||'')).children, false)), false, '#root');
}

/* ---- o modelo: formulário estruturado -> HTML padrão ---- */
function draftNormalize(d){
  d = isPlainObject(d) ? d : {};
  const s = (v,n)=>procClampStr(v,n), arr = (x,max)=>Array.isArray(x) ? x.filter(isPlainObject).slice(0,max) : [];
  return {
    title:s(d.title,200), client:s(d.client,120), tags:s(d.tags,300),
    products:(Array.isArray(d.products)?d.products:[]).filter(p=>PRODUCTS.some(x=>x.id===p)).filter((p,i,a)=>a.indexOf(p)===i),
    overview:s(d.overview,4000),
    values:arr(d.values,40).map(r=>({ name:s(r.name,40).trim(), description:s(r.description,200), example:s(r.example,200), source:phSourceOk(r.source)?r.source:'session' })),
    highlights:s(d.highlights,2000),
    steps:arr(d.steps,60).map(r=>({ title:s(r.title,200), commands:s(r.commands,4000), expected:s(r.expected,1000) })),
    errors:arr(d.errors,30).map(r=>({ symptom:s(r.symptom,300), cause:s(r.cause,300), action:s(r.action,500) })),
    cleanup:s(d.cleanup,2000), evidence:s(d.evidence,2000)
  };
}
function draftBlank(){ return draftNormalize({ steps:[{}], values:[{}], errors:[{}] }); }
/* Os títulos das seções são os dos runbooks (em português, como o contrato do formato) qualquer que seja o idioma da tela. */
function procBuildHtml(d){
  const lines = (t)=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const paras = (t)=>String(t||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('');
  const ul = (t)=>{ const it = lines(t); return it.length ? '<ul>'+it.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>' : ''; };
  let h = '<h1>'+esc(d.title)+'</h1>' + paras(d.overview);
  const vals = d.values.filter(r=>r.name);
  if(vals.length) h += '<h2>Valores desta sessão</h2><table><thead><tr><th>Placeholder</th><th>O que é</th><th>Exemplo</th></tr></thead><tbody>'
    + vals.map(r=>'<tr><td><kbd>&lt;'+esc(r.name)+'&gt;</kbd></td><td>'+esc(r.description)+'</td><td>'+esc(r.example)+'</td></tr>').join('') + '</tbody></table>';
  if(lines(d.highlights).length) h += '<h2>O que ressaltar</h2>' + ul(d.highlights);
  d.steps.forEach((st,i)=>{
    if(!st.title.trim() && !st.commands.trim() && !st.expected.trim()) return;
    h += '<h2>'+(i+1)+'. '+esc(st.title.trim()||('Passo '+(i+1)))+'</h2>' + (st.commands.trim() ? '<pre>'+esc(st.commands.replace(/\s+$/,''))+'</pre>' : '') + (st.expected.trim() ? '<p><b>Esperado:</b> '+esc(st.expected.trim())+'</p>' : '');
  });
  const errs = d.errors.filter(r=>r.symptom.trim()||r.cause.trim()||r.action.trim());
  if(errs.length) h += '<h2>Se der erro</h2><table><thead><tr><th>Sintoma</th><th>Causa</th><th>Ação</th></tr></thead><tbody>'
    + errs.map(r=>'<tr><td>'+esc(r.symptom)+'</td><td>'+esc(r.cause)+'</td><td>'+esc(r.action)+'</td></tr>').join('') + '</tbody></table>';
  if(lines(d.cleanup).length) h += '<h2>Limpeza</h2>' + ul(d.cleanup);
  if(lines(d.evidence).length) h += '<h2>Evidências para o relatório</h2>' + ul(d.evidence);
  return h;
}
function phUsedIn(d){
  const text = [d.overview, d.highlights, d.cleanup, d.evidence].concat(d.steps.map(x=>[x.title,x.commands,x.expected].join('\n')), d.errors.map(x=>[x.symptom,x.cause,x.action].join('\n'))).join('\n');
  const used = [], re = /<([A-Z][A-Z0-9_]{0,39})>/g; let m;
  while((m = re.exec(text))) if(used.indexOf(m[1])<0) used.push(m[1]);
  return used;
}
function draftWarnings(d){
  const names = d.values.map(r=>r.name).filter(Boolean), used = phUsedIn(d), seen = {}, invalid = [];
  names.forEach(n=>{ if(!PH_NAME_RE.test(n) || seen[n]) invalid.push(n); seen[n] = 1; });
  return { undeclared:used.filter(n=>names.indexOf(n)<0), unused:names.filter(n=>PH_NAME_RE.test(n) && used.indexOf(n)<0), invalid:invalid,
    secretish:names.filter(n=>PH_NAME_RE.test(n) && phIsSecretName(n)),
    emptySteps:d.steps.map((s,i)=>(s.title.trim() && !s.commands.trim() && !s.expected.trim()) ? i+1 : 0).filter(Boolean) };
}

/* ---- vínculo teste ↔ procedimento ----
   O teste guarda só `procId` e `procVersion` (nada do HTML): o projeto viaja sem a biblioteca, que é por navegador. Se o procedimento
   não existir aqui (outro navegador, ou foi excluído), a linha mostra um aviso neutro e nada quebra. Sem embeddings: o ranking
   soma sobreposição de palavras-chave (tags 4, título 3, títulos de seção 2, corpo 1) e dá bônus se o produto do teste consta
   nos produtos do procedimento. O limite para sugerir (PROC_MIN_SCORE) vale só para as palavras: o bônus de produto ordena, mas
   nunca transforma um acerto fraco (uma palavra solta no corpo) em sugestão. */
const PROC_STOP = new Set('para com uma uns umas das dos que por nos nas ser sem como mais entre sobre ate esta este isso cada sao pelo pela the and for with that this from are not can will you your all any per via has have was los las con del sus'.split(' '));
const PROC_MIN_SCORE = 3, PROC_MAX_SUGGESTIONS = 6;
let procPicker = null, libraryReturnTo = null;
function procFold(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function procTokens(s){ return procFold(s).split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !PROC_STOP.has(w) && !/^\d+$/.test(w)); }
function procIndex(p){
  const secs = procSections(p.html).sections;
  return { title:new Set(procTokens(p.title)), tags:new Set(procTokens(p.tags.join(' '))), heads:new Set(procTokens(secs.map(s=>s.title).join(' '))), body:new Set(procTokens(secs.map(s=>s.text).join(' '))), fold:procFold([p.title].concat(p.tags, secs.map(s=>s.title)).join(' ')) };
}
function procTestText(t){
  const it = testItem(t);
  return it ? [it.t.pt, it.t.en, it.t.es, it.x.pt, it.x.en, it.x.es].join(' ') : (t.text || '');
}
/* [{proc, score, why:{product, tags, words}}], do maior para o menor score. */
function procRank(testText, productId, list){
  const want = Array.from(new Set(procTokens(testText)));
  return list.map(p=>{
    const ix = procIndex(p), why = { product:false, tags:[], words:[] }; let score = 0;
    want.forEach(w=>{
      if(ix.tags.has(w)){ score += 4; why.tags.push(w); }
      else if(ix.title.has(w)){ score += 3; why.words.push(w); }
      else if(ix.heads.has(w)){ score += 2; why.words.push(w); }
      else if(ix.body.has(w)){ score += 1; }
    });
    const kw = score;   // acerto só de palavras: é ele que decide se vira sugestão; o produto só ajuda a ordenar
    if(score>0 && p.products.indexOf(productId)>=0){ score += 6; why.product = true; }
    return { proc:p, score:score, kw:kw, why:why, fold:ix.fold };
  }).sort((a,b)=>b.score-a.score || a.proc.title.localeCompare(b.proc.title) || b.proc.version-a.proc.version);
}
function procLatestPerFamily(list){
  const best = {}; list.forEach(p=>{ if(!best[p.family] || p.version>best[p.family].version) best[p.family] = p; });
  return list.filter(p=>best[p.family]===p);
}
/* Sem busca: só sugestões com acerto real (score mínimo), no máximo 6. Com busca: tudo que contém o texto (título, tags, seções). */
function procCandidates(picker, testText, productId){
  let list = loadLibrary(); if(!picker.all) list = procLatestPerFamily(list);
  const ranked = procRank(testText, productId, list), q = procFold(picker.query).trim();
  return q ? ranked.filter(r=>r.fold.indexOf(q)>=0) : ranked.filter(r=>r.kw>=PROC_MIN_SCORE).slice(0, PROC_MAX_SUGGESTIONS);
}

  const box = (inner)=>'<div class="field-box no-print" style="margin-top:2px;">'+inner+'</div>';
  if(!lib.length) return box('<div class="text-xs">' + g('A biblioteca de procedimentos está vazia neste navegador.','The procedure library is empty in this browser.','La biblioteca de procedimientos está vacía en este navegador.')

    + (rows || '<p class="text-xs text-muted mt-2">' + (ps.query ? g('Nada encontrado.','Nothing found.','No se encontró nada.') : g('Nenhuma sugestão com acerto suficiente. Busque pelo nome ou tag.','No suggestion matches well enough. Search by name or tag.','Ninguna sugerencia coincide lo suficiente. Busque por nombre o tag.')) + '</p>')

function procLinkLine(p, x, g){
  const t = x.t, i = x.i, lib = loadLibrary(), L = state.lang;

      main = '<span class="text-xs" style="font-weight:800;">' + Icon('book') + ' ' + esc(proc.title) + '</span> <span class="pill">v'+proc.version+'</span> <span class="pill '+(proc.status==='validado'?'pill-ok':'pill-warn')+'">'+PROC_STATUS_LABEL[proc.status][L]+'</span>'
        + (newest.id!==proc.id ? ' <span class="pill pill-warn">v'+newest.version+' '+g('disponível','available','disponible')+'</span> ' + btn('btn-ghost', 'P.testLinkProc(\''+p.id+'\','+i+',\''+newest.id+'\')', g('Atualizar','Update','Actualizar')) : '')

  return '<div class="flex items-center gap-2 flex-wrap no-print">' + main + today + '</div>' + procValuesHtml(p, x, g) + (open ? procPickerHtml(p, x, g) : '');

/* ---- roteiro do dia ----
   Os testes marcados com "Roteiro de hoje" (`today`, opcional no caso de teste) viram uma folha impressa: o ambiente da PoC, depois cada
   teste com os passos do procedimento vinculado. O ambiente usa só o que o resumo em Markdown já considera seguro (nada de credenciais; proxy
   com usuário/senha na URL é omitido). Um procedimento usado por vários testes sai uma vez, completo; os demais apontam para o item. */
function dayTests(){
  const out = [];
  PRODUCTS.forEach(p=>{ if(state.selectedProducts[p.id]) orderedTests(p.id).forEach(x=>{ if(x.t.today) out.push({ p:p, x:x }); }); });
  return out;
}
function testTitle(t, L){ const it = testItem(t); return it ? (it.t[L]||it.t.en) : (t.text||'—'); }
function dayEnvironmentHtml(g){
  const n = state.network, pr = state.project, sp = state.selectedProducts, v = (x)=>esc(x==null||x===''?'—':x);
  const kv = (rows)=>'<table class="day-params"><tbody>' + rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+v(r[1])+'</td></tr>').join('') + '</tbody></table>';
  const proxy = (u)=>!u ? '—' : (urlHasSecret(u) ? g('(oculto: contém credenciais)','(hidden: contains credentials)','(oculto: contiene credenciales)') : u);
  rebuildVms();
  let h = '<h4>' + g('Ambiente desta PoC','This PoC’s environment','Entorno de esta PoC') + '</h4>'
    + kv([[g('Produtos','Products','Productos'), PRODUCTS.filter(p=>sp[p.id]).map(p=>p.name).join(', ')],
          [g('Cliente','Client','Cliente'), pr.clientOrganization], [g('Engenheiro responsável','Lead engineer','Ingeniero responsable'), pr.leadEngineer]])
    + kv([['CIDR', n.managementCidr], ['Gateway', n.gatewayIp], ['VIP', n.clusterVip], [g('Pool de IPs','IP pool','Pool de IPs'), (n.ipPoolStart||'—')+' – '+(n.ipPoolEnd||'—')],
          ['DNS', n.dnsServers], ['NTP', n.ntpServers], [g('Domínio','Domain','Dominio'), n.domain], ['Air-gap', n.hasAirGap ? g('sim','yes','sí') : g('não','no','no')]]
          .concat(n.hasProxy ? [['Proxy HTTP', proxy(n.httpProxy)], ['Proxy HTTPS', proxy(n.httpsProxy)], ['No proxy', n.noProxy]] : []));
  if(n.vms.length) h += '<table class="day-params"><thead><tr><th>' + g('VM / nó','VM / node','VM / nodo') + '</th><th>' + g('Papel','Role','Rol') + '</th><th>Hostname</th><th>IP</th></tr></thead><tbody>'
    + n.vms.map(m=>'<tr><td>'+esc(productOrFallback(m.product).name)+'</td><td>'+v(m.role)+'</td><td>'+v(m.hostname)+'</td><td>'+v(m.ip)+'</td></tr>').join('') + '</tbody></table>';
  return h;
}
function dayItemHtml(k, p, x, g, seen, lib){
  const t = x.t, it = testItem(t), L = state.lang, prio = testPriority(t);
  let h = '<div class="day-item"><h4>' + k + '. ' + esc(testTitle(t,L)) + ' <span class="day-tag">' + (prio==='must' ? 'must-have' : 'nice-to-have') + '</span> <span class="day-prod">' + esc(p.name) + '</span></h4>';
  if(it) h += '<p class="day-exp">' + g('Resultado esperado: ','Expected result: ','Resultado esperado: ') + esc(it.x[L]||it.x.en) + '</p>';
  const proc = t.procId ? lib.filter(q=>q.id===t.procId)[0] : null;
  if(!t.procId) h += '<p class="day-warn">' + g('Sem procedimento vinculado.','No linked procedure.','Sin procedimiento vinculado.') + '</p>';
  else if(!proc) h += '<p class="day-warn">' + g('O procedimento vinculado não está na biblioteca deste navegador.','The linked procedure is not in this browser’s library.','El procedimiento vinculado no está en la biblioteca de este navegador.') + '</p>';
  else {
    h += '<p class="day-proc">' + g('Procedimento: ','Procedure: ','Procedimiento: ') + '<strong>' + esc(proc.title) + '</strong> v' + proc.version + '</p>';
    if(seen[proc.id]) h += '<p class="day-exp">' + g('Os passos já estão impressos no item ','The steps are already printed under item ','Los pasos ya están impresos en el ítem ') + seen[proc.id] + '.</p>';
    else { seen[proc.id] = k; h += procSections(proc.html).sections.map(s=>'<div class="passo"><h5>' + esc(s.title) + '</h5><div class="proc-body">' + procSubstituteHtml(s.html, proc.placeholders, t) + '</div></div>').join(''); }
  }
  return h + '<p class="day-fill">' + g('Resultado:','Result:','Resultado:') + ' ☐ ' + g('Atende','Meets','Cumple') + ' &nbsp; ☐ ' + g('Parcial','Partial','Parcial') + ' &nbsp; ☐ ' + g('Não atende','Does not meet','No cumple') + ' &nbsp;&nbsp; ' + g('Evidência:','Evidence:','Evidencia:') + ' ____________________</p></div>';
}
function buildDaySheetHtml(g){
  const pr = state.project, sel = dayTests(), lib = loadLibrary(), seen = {};
  return '<h3 style="margin:0 0 4px;">' + (pr.projectName ? esc(pr.projectName) + ' — ' : '') + g('Roteiro do dia','Day script','Guion del día') + '</h3>'
    + '<div class="day-sub">' + esc(pr.clientOrganization||'') + (pr.clientOrganization?' · ':'') + todayISO() + '</div>'
    + dayEnvironmentHtml(g)
    + '<h4>' + g('Testes de hoje','Today’s tests','Pruebas de hoy') + ' (' + sel.length + ')</h4>'
    + (sel.length ? sel.map((e,i)=>dayItemHtml(i+1, e.p, e.x, g, seen, lib)).join('') : '<p class="day-warn">' + g('Nenhum teste marcado. Na etapa Testes, marque “Roteiro de hoje” nos testes da sessão.','No test selected. In the Tests step, tick “Today’s script” on the session’s tests.','Ninguna prueba marcada. En la etapa Pruebas, marque “Guion de hoy” en las pruebas de la sesión.') + '</p>');
}

/* ---------------- helpers ---------------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function field(label, path, opts){
  opts = opts||{};
  const val = getPath(state, path);
  const type = opts.type || 'text';
  if(type==='select'){
    return '<div><label class="field-label">'+label+'</label><select onchange="P.setField'+(opts.liveRender?'AndRender':'')+'(\''+path+'\', this.value)">'
      + (opts.options||[]).map(o=>'<option value="'+o.value+'" '+(val===o.value?'selected':'')+'>'+o.label+'</option>').join('')
      + '</select></div>';
  }
  if(type==='checkbox'){
    return '<label class="flex items-center gap-2" style="cursor:pointer;font-size:12.5px;font-weight:700;"><input type="checkbox" '+(val?'checked':'')+' onchange="P.setFieldAndRender(\''+path+'\', this.checked)" style="width:16px;height:16px;accent-color:var(--suse-base);">'+label+'</label>';
  }
  if(type==='textarea'){
    return '<div><label class="field-label">'+label+'</label><textarea rows="'+(opts.rows||3)+'" oninput="P.setField(\''+path+'\', this.value)">'+esc(val)+'</textarea></div>';
  }
  const valueExpr = 'this.'+(type==='number'?'valueAsNumber || 0':'value');
  const attrs = 'type="'+type+'" value="'+esc(val)+'" placeholder="'+(opts.placeholder||'')+'" '+(opts.min!=null?'min="'+opts.min+'"':'');
  return opts.liveRender
    ? '<div><label class="field-label">'+label+'</label><input '+attrs+' oninput="P.setField(\''+path+'\', '+valueExpr+')" onchange="render()"></div>'
    : '<div><label class="field-label">'+label+'</label><input '+attrs+' oninput="P.setField(\''+path+'\', '+valueExpr+')"></div>';
}

/* A ISO Essencial do EIB é um pacote fixo (Longhorn + NeuVector + Harbor): escolher só parte dos três não monta uma ISO menor. */
function essencialBundleNote(g){
  const sp = state.selectedProducts, trio = [['storage','Longhorn'],['security','NeuVector'],['registry','Harbor']];
  const chosen = trio.filter(x=>sp[x[0]]);
  if(!chosen.length || chosen.length===trio.length) return '';
  const extra = trio.filter(x=>!sp[x[0]]).map(x=>x[1]).join(' + ');
  return '<div class="alert alert-info mt-3">' + Icon('info') + ' '
    + g('A ISO air-gapped “Essencial” (EIB) é um pacote fixo: Longhorn + NeuVector + Harbor sempre vão juntos. Com a seleção atual, a ISO também traria '+extra+'.',
        'The air-gapped “Essencial” ISO (EIB) is a fixed bundle: Longhorn + NeuVector + Harbor always ship together. With the current selection the ISO would also include '+extra+'.',
        'La ISO air-gapped “Essencial” (EIB) es un paquete fijo: Longhorn + NeuVector + Harbor siempre van juntos. Con la selección actual, la ISO también incluiría '+extra+'.')
  + '</div>';
}

/* ---------------- NETWORK / IP POOL ---------------- */
function ipToInt(ip){ const p=(ip||'0.0.0.0').split('.').map(n=>parseInt(n,10)||0); return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]; }
function intToIp(n){ return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.'); }
function rebuildVms(){
  const sp = state.selectedProducts;
  const desired = [];
  if(sp.virtualization){ for(let i=0;i<state.infra.virtualization.nodeCount;i++) desired.push({key:'virtualization-'+i,product:'virtualization',role:i<3?'Management/HCI':'Worker HCI',defaultUser:'rancher'}); }
  if(sp.rancher){ desired.push({key:'rancher-vm',product:'rancher',role:'Rancher Server',defaultUser:'opensuse'}); }
  if(sp.observability){ desired.push({key:'observability-vm',product:'observability',role:'Observability',defaultUser:'opensuse'}); }
  if(sp.manager){ for(let i=0;i<state.infra.manager.nodeCount;i++) desired.push({key:'manager-'+i,product:'manager',role:'Multi-Linux Manager Server',defaultUser:'root'}); }
  { const addonIds=['security','storage','registry','appcollection'].filter(id=>sp[id]); if(addonIds.length){ desired.push({key:'addons-vm',product:'addons',role:'Downstream cluster ('+addonIds.filter(id=>id!=='appcollection').join(', ')+(addonIds.indexOf('appcollection')>=0 ? (addonIds.length>1?' · ':'')+'pulls from Application Collection' : '')+')',defaultUser:'opensuse'}); } }

  const existingByKey = {}; (state.network.vms||[]).forEach(v=>existingByKey[v.key]=v);
  const usedIps = new Set(Object.values(existingByKey).map(v=>v.ip).filter(Boolean));
  let ip = ipToInt(state.network.ipPoolStart || '192.168.1.20');
  const endIp = ipToInt(state.network.ipPoolEnd || '192.168.1.60');
  let counter = {};
  const newList = desired.map(d=>{
    if(existingByKey[d.key]){ existingByKey[d.key].role = d.role; return existingByKey[d.key]; }   // o papel é derivado, não editável
    counter[d.product] = (counter[d.product]||0)+1;
    while(ip<=endIp && usedIps.has(intToIp(ip))) ip++;
    const assigned = ip<=endIp ? intToIp(ip) : '';
    if(assigned){ usedIps.add(assigned); ip++; }
    return {key:d.key, product:d.product, role:d.role, hostname:(d.product==='addons'?'downstream':d.product)+'-'+counter[d.product], ip:assigned, user:d.defaultUser, password:''};
  });
  state.network.vms = newList;
  saveState();
}
/* ---------------- VERSION PIN (K3s / Rancher) ----------------
   Busca as últimas versões via API pública com CORS liberado (confirmado: GitHub API
   e releases.rancher.com; update.k3s.io NÃO tem CORS, por isso não é usado aqui) pra
   popular os dropdowns de pin de versão. Cacheado em localStorage por 24h; offline ou
   bloqueado, cai de volta pra só "Automático (stable)" sem quebrar a tela. */
const VERSION_CACHE_KEY = 'poc-planner-version-cache';
const VERSION_CACHE_TTL = 24*60*60*1000;
let versionCache = null, versionFetchInFlight = false, versionFetchFailedAt = 0;
function loadVersionCache(){
  if(versionCache) return versionCache;
  try{ versionCache = JSON.parse(localStorage.getItem(VERSION_CACHE_KEY)||'null'); }catch(e){ versionCache = null; }
  return versionCache;
}
function versionCacheFresh(){
  const c = loadVersionCache();
  return !!(c && c.fetchedAt && (Date.now()-c.fetchedAt) < VERSION_CACHE_TTL);
}
async function fetchK3sVersions(){
  const res = await fetch('https://api.github.com/repos/k3s-io/k3s/releases?per_page=40');
  if(!res.ok) throw new Error('k3s fetch failed');
  const data = await res.json();
  return data.filter(r=>!r.prerelease && !r.draft).map(r=>r.tag_name).slice(0,12);
}
async function fetchRancherVersions(){
  const res = await fetch('https://releases.rancher.com/server-charts/stable/index.yaml');
  if(!res.ok) throw new Error('rancher fetch failed');
  const text = await res.text();
  /* Isola só o bloco da chart "rancher" (o index.yaml também tem rancher-alerting-drivers,
     rancher-partner-charts etc. — um grep ingênuo de "version:" pegaria as deles também). */
  const m = text.match(/\n {2}rancher:\n([\s\S]*?)(?=\n {2}(?!- )\S|\n\S|$)/);
  const block = m ? m[1] : '';
  const versions = Array.from(block.matchAll(/\n\s*version:\s*([0-9]+\.[0-9]+\.[0-9]+)/g)).map(x=>x[1]);
  const uniq = Array.from(new Set(versions));
  uniq.sort((a,b)=>b.localeCompare(a, undefined, {numeric:true}));
  return uniq.slice(0,12);
}
function refreshVersionCache(){
  /* Após uma falha (ex.: 429 da API do GitHub) não tenta de novo por 5 min: o .finally()
     abaixo re-renderiza, e o render chama este refresh — sem esse freio vira loop infinito. */
  if(versionFetchInFlight || versionCacheFresh() || (Date.now()-versionFetchFailedAt) < 5*60*1000) return;
  versionFetchInFlight = true;
  Promise.all([fetchK3sVersions(), fetchRancherVersions()])
    .then(([k3s, rancher])=>{
      versionCache = { k3s, rancher, fetchedAt: Date.now() };
      localStorage.setItem(VERSION_CACHE_KEY, JSON.stringify(versionCache));
    })
    .catch(()=>{ /* offline ou bloqueado: mantém o que já tinha e segue só com "Automático" */ versionFetchFailedAt = Date.now(); })
    .finally(()=>{ versionFetchInFlight = false; if(state.view==='infra') render(); });
}
function versionPinOptions(list, g){
  return [{value:'',label:g('Automático (stable)','Automatic (stable)','Automático (stable)')}]
    .concat((list||[]).map(v=>({value:v,label:v})));
}
function renderVersionPinCard(g, sp){
  if(state.installApproach!=='eib') return '';
  if(!eibApplicableProfiles().length) return '';
  if(!versionCacheFresh()) refreshVersionCache();
  const vc = loadVersionCache() || {};
  return '<div class="card">'
    + '<h2 class="section-title mb-3">' + Icon('box') + ' ' + g('Versões para build via EIB','Versions for the EIB build','Versiones para el build vía EIB') + '</h2>'
    + '<p class="text-xs text-muted mb-2">' + g('Opcional — só é usado se você gerar a ISO via EIB (run.sh). Deixe em "Automático" para resolver a última versão estável no momento do build.','Optional — only used if you build the ISO via EIB (run.sh). Leave as "Automatic" to resolve the latest stable version at build time.','Opcional — solo se usa si genera la ISO vía EIB (run.sh). Deje en "Automático" para resolver la última versión estable en el momento del build.') + '</p>'
    + '<div class="grid grid-3">'
      + field(g('Versão do K3s','K3s version','Versión de K3s'),'k3sVersionPin',{type:'select',liveRender:true,options:versionPinOptions(vc.k3s,g)})
      + (sp.rancher ? field(g('Versão do Rancher','Rancher version','Versión de Rancher'),'rancherVersionPin',{type:'select',liveRender:true,options:versionPinOptions(vc.rancher,g)}) : '')

  + '</div>';
}

function normClient(s){

function eibCommonFields(){

    if(diff > 0) pocDays = String(diff);

/* Um único arquivo pro run.sh ler: cada campo vira "p<N>_CAMPO" (ex: p1_NODE_HOSTNAME),
   em vez de um JSON por perfil com um campo "profile". Mantém o parser do run.sh simples
   (grep/sed num objeto plano, sem aninhamento) e evita múltiplos downloads. */
/* Arquivo de exportação único. `planner` = estado completo (reimportável); `eib` = as chaves p<N>_ que o run.sh lê
   (grep puro, ignora aninhamento: valores precisam seguir strings e os prefixos p<N>_ únicos no arquivo). */
const EXPORT_SCHEMA = 2;
function buildExportJson(){
  rebuildVms();
  return { schema:EXPORT_SCHEMA, planner:state, eib:buildEibCombinedJson(), poc_markdown:buildPocMarkdown() };

/* Exportação "sem segredos": o mesmo arquivo (mesmo esquema, mesmas chaves p<N>_ no `eib`), mas com os valores secretos
   esvaziados. O run.sh trata campo vazio como ausente e pergunta, então ele continua servindo para build. O resto do
   texto livre (notas, evidências) fica: é dado do plano. Roda sobre uma cópia; o estado em uso não é tocado. */
function secretUrl(v){ return typeof v==='string' && ((/^[a-z][a-z0-9+.-]*:\/\//i.test(v.trim()) && urlHasSecret(v)) || /[?&](token|key|secret|password|passwd|pass|sig|signature)=/i.test(v)); }
function stripSecretsInPlace(st){
  st.credentials = defaultState().credentials;
  (st.network.vms||[]).forEach(v=>{ v.password = ''; });
  ['httpProxy','httpsProxy'].forEach(k=>{ if(urlHasSecret(st.network[k])) st.network[k] = ''; });   // inclui proxy sem esquema (usuario:senha@host)
  (function walk(o){ if(!o || typeof o!=='object') return; Object.keys(o).forEach(k=>{ if(typeof o[k]==='string'){ if(secretUrl(o[k])) o[k] = ''; } else walk(o[k]); }); })(st);
  return st;
}
function buildSafeExportJson(){
  const saved = state;
  state = stripSecretsInPlace(JSON.parse(JSON.stringify(saved)));
  try{ return buildExportJson(); } finally { state = saved; }
}
