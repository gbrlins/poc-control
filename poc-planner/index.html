/* ---------------- ARCHITECTURE DIAGRAM ----------------
   SVG em camadas, claro e com texto escuro (imprime bem em branco): serviços externos, switch,
   redes (mgmt / VLANs de VM / storage), hosts e cargas. `archModel` só junta os dados já
   coletados — nada é inventado: o que não foi informado aparece como "a confirmar". */
function archFit(t, n){ t = String(t==null ? '' : t); return t.length > n ? t.slice(0, Math.max(1,n-1)) + '…' : t; }
function archModel(L){
  const g=(pt,en,es)=>({pt,en,es})[L] || en;
  const sp=state.selectedProducts, v=state.infra.virtualization, vn=state.virtNet, n=state.network, vi=state.virtInstall;
  const prod=(id)=>PRODUCTS.find(p=>p.id===id);
  const m = { external:[], sw:null, lanes:[], cluster:null, hosts:null, storage:null, guests:[], baseLabel:'' };

  m.external.push({ key:'admin', title:'Admins', sub:'https://'+(n.clusterVip||'VIP'), color:'#64748b' });
  if(n.hasProxy) m.external.push({ key:'proxy', title:'Proxy HTTP(S)', sub:n.httpProxy||n.httpsProxy||g('a informar','tbd','por informar'), color:'#64748b' });
  else if(n.hasAirGap) m.external.push({ key:'airgap', title:'Air-gap', sub:g('sem internet','no internet','sin internet'), color:'#64748b' });
  else m.external.push({ key:'internet', title:'Internet', sub:'registry.suse.com', color:'#64748b' });
  if(sp.virtualization && vn.backup.type && vn.backup.type!=='none') m.external.push({ key:'backup', title:'Backup · '+vn.backup.type.toUpperCase(), sub:vn.backup.endpoint||g('a informar','tbd','por informar'), color:'#9333ea' });
  if(sp.rancher && (vn.auth.provider==='ad'||vn.auth.provider==='ldap')) m.external.push({ key:'dir', title:vn.auth.provider.toUpperCase(), sub:vn.auth.server||g('a informar','tbd','por informar'), color:'#64748b' });
  if(sp.appcollection) m.external.push({ key:'appcol', title:'App Collection', sub:'dp.apps.rancher.io (SaaS)', color:prod('appcollection').color });
  m.external.push({ key:'dns', title:'DNS / NTP', sub:((n.dnsServers||'').split(',')[0]||'—').trim()+' · '+((n.ntpServers||'').split(',')[0]||'—').trim(), color:'#64748b' });

  const nicTxt = (vn.mgmtNics||vn.vmNics) ? (vn.mgmtNics||'?')+'+'+(vn.vmNics||'?')+' NIC'+(vn.nicSpeed?' · '+vn.nicSpeed.replace('G',' Gbps'):'') : '';
  m.sw = { title:g('Switch(es) top-of-rack','Top-of-rack switch(es)','Switch(es) top-of-rack'),
           sub:(vn.switchTrunk ? g('trunk (VLANs liberadas)','trunk (VLANs allowed)','trunk (VLANs permitidas)') : g('modo da porta a confirmar','port mode to confirm','modo del puerto por confirmar')) + (nicTxt?' · '+nicTxt:''), ok:!!vn.switchTrunk };

  m.lanes.push({ key:'mgmt', name:'mgmt', color:'#0ea5e9', detail:(n.managementCidr||'—')+' · VIP '+(n.clusterVip||'—')+' · GW '+(n.gatewayIp||'—') });
  if(sp.virtualization){
    const nets = vn.vmNetworks.filter(x=>x.name||x.vlan);
    m.lanes.push({ key:'vm', name:g('Redes de VM','VM networks','Redes de VM'), color:'#30ba78', dashed:!nets.length,
      detail: nets.length ? nets.map(x=>(x.name||'?')+(x.vlan?' (VLAN '+x.vlan+')':'')).join(' · ') : g('a definir (guia §13.2.3)','to define (guide §13.2.3)','por definir (guía §13.2.3)') });
    if(vn.storageNet.dedicated) m.lanes.push({ key:'storage', name:'storage', color:'#a855f7', detail:[vn.storageNet.nics, vn.storageNet.vlan?'VLAN '+vn.storageNet.vlan:''].filter(Boolean).join(' · ') || g('rede dedicada','dedicated network','red dedicada') });
  }

  if(sp.virtualization){
    const cnt=Math.max(1,v.nodeCount), MAXH=12, shown=Math.min(cnt, cnt>MAXH?MAXH-1:cnt);
    const spec = v.cpuCores+'c · '+v.ramGb+' GB · '+(v.diskGb>=1000 ? fmtNum(Math.round(v.diskGb/100)/10)+'TB' : v.diskGb+' GB');
    m.hosts = { count:cnt, shown:shown, more:cnt-shown, spec:spec, nic:nicTxt };
    const repl = 3;   // padrão do guia; ajustável na StorageClass
    m.cluster = { title:'SUSE Virtualization '+(vi.targetVersion||''), sub:'VIP '+(n.clusterVip||'—') };
    m.storage = { title:'Longhorn · '+g('storage distribuído nos discos locais','distributed storage on local disks','storage distribuido en discos locales'), sub:g('réplicas','replicas','réplicas')+' '+repl+(vn.backup.type&&vn.backup.type!=='none' ? ' · '+g('backup','backup','backup')+' → '+vn.backup.type.toUpperCase() : '') };
    m.baseLabel = 'SUSE Virtualization';
  } else m.baseLabel = g('Infraestrutura existente','Existing infrastructure','Infraestructura existente');

  const lb = (sp.rancher && n.hasLoadBalancer) ? ' · LB :443' : '';
  {
    const vm=(id,line1,line2)=>m.guests.push({ title:prod(id).name, color:prod(id).color, line1:line1, line2:line2||'' });
    if(sp.rancher){ const s=state.infra.rancher.vmSize; vm('rancher', s.cpu+' vCPU · '+s.ram+' GB · '+s.disk+' GB', lb.replace(' · ','')); }
    if(sp.observability){ const s=state.infra.observability.vmSize; vm('observability', s.cpu+' vCPU · '+s.ram+' GB · '+s.disk+' GB'); }
    const addIds=['security','storage','registry'].filter(id=>sp[id]);
    if(addIds.length){ const s=state.infra.addons.vmSize; m.guests.push({ title:g('Cluster downstream','Downstream cluster','Clúster downstream'), color:'#9333ea', line1:s.cpu+' vCPU · '+s.ram+' GB · '+s.disk+' GB', line2:addIds.map(id=>prod(id).name.replace('SUSE ','')).join(' · ') }); }
    if(sp.manager){ const s=state.infra.manager; vm('manager', s.nodeCount+' × '+s.cpuCores+' vCPU · '+s.ramGb+' GB'); }
  }
  return m;
}
function buildArchitectureDiagram(L){
  const g=(pt,en,es)=>({pt,en,es})[L] || en;
  const m = archModel(L), W = 900, P = 10, e = esc;
  const rect=(x,y,w,h,c,o)=>{ o=o||{}; return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.rx||8)+'" fill="'+(o.fill||c)+'" fill-opacity="'+(o.fo==null?.1:o.fo)+'" stroke="'+c+'" stroke-width="'+(o.sw||1.5)+'"'+(o.dash?' stroke-dasharray="5 4"':'')+'/>'; };
  const text=(x,y,t,cls,anchor)=>'<text x="'+x+'" y="'+y+'" class="'+cls+'"'+(anchor?' text-anchor="'+anchor+'"':'')+'>'+e(t)+'</text>';
  const line=(x1,y1,x2,y2,c)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(c||'#94a3b8')+'" stroke-width="1.5"/>';
  let y = 8, body = '';

  // 1) externos
  const k = m.external.length, gap = 10, bw = (W-2*P-(k-1)*gap)/k, eh = 54, chars = Math.floor((bw-14)/6.8);
  m.external.forEach((x,i)=>{ const bx = P+i*(bw+gap);
    body += rect(bx,y,bw,eh,x.color,{dash:true}) + text(bx+bw/2,y+22,archFit(x.title,Math.floor((bw-14)/8.8)),'a-t','middle') + text(bx+bw/2,y+41,archFit(x.sub,chars),'a-s','middle'); });
  const extBottom = y+eh; y += eh + 20;
  // 2) switch
  const swY = y, swH = 48;
  m.external.forEach((x,i)=>{ const cx = P+i*(bw+gap)+bw/2; body += line(cx,extBottom,cx,swY,'#94a3b8'); });
  body += rect(P,swY,W-2*P,swH,m.sw.ok?'#0f766e':'#b45309',{fo:.1}) + text(W/2,swY+21,m.sw.title,'a-t','middle') + text(W/2,swY+39,archFit(m.sw.sub,118),'a-s','middle');
  y = swY + swH + 10;
  // 3) redes
  const laneTop = y;
  m.lanes.forEach(l=>{ body += rect(P,y,W-2*P,28,l.color,{rx:6,fo:.14,dash:l.dashed,sw:1.2}) + text(P+10,y+19,l.name,'a-t') + text(P+135,y+19,archFit(l.detail,Math.floor((W-2*P-145)/6.8)),'a-s'); y += 33; });
  const laneBottom = y - 5; y += 14;
  // 4) cluster / hosts / storage / cargas
  const frameY = y; let inner = y + 34;
  let hostsBlock = '', hostCenters = [];
  if(m.hosts){
    const per = 5, total = m.hosts.shown + (m.hosts.more>0?1:0), rows = Math.ceil(total/per), hw = (W-2*P-24-(per-1)*8)/per, hh = 76;
    for(let i=0;i<total;i++){
      const r = Math.floor(i/per), c = i%per, hx = P+12+c*(hw+8), hy = inner + r*(hh+8), isMore = i===m.hosts.shown && m.hosts.more>0;
      if(isMore){ hostsBlock += rect(hx,hy,hw,hh,'#64748b',{dash:true}) + text(hx+hw/2,hy+hh/2+5,'+'+m.hosts.more+' '+g('hosts','hosts','hosts'),'a-t','middle'); }
      else { const mg = i<3 && m.hosts.count>=3;
        hostsBlock += rect(hx,hy,hw,hh,'#30ba78',{fo:.12}) + text(hx+8,hy+19,'Host '+(i+1),'a-t') + text(hx+8,hy+36,mg?'mgmt / HCI':(m.hosts.count>=3?'worker HCI':'HCI'),'a-s') + text(hx+8,hy+53,archFit(m.hosts.spec,Math.floor((hw-12)/6.3)),'a-s') + text(hx+8,hy+70,archFit(m.hosts.nic||'',Math.floor((hw-12)/6.8)),'a-s'); }
      if(r===0) hostCenters.push(hx+hw/2);
    }
    inner += rows*(hh+8);
    hostCenters.forEach(cx=>{ hostsBlock += line(cx,laneBottom,cx,inner-rows*(hh+8)) ; });
    hostsBlock += '';
    // storage band
    hostsBlock += rect(P+12,inner,W-2*P-24,30,'#9333ea',{rx:6,fo:.12}) + text(P+22,inner+20,archFit(m.storage.title,52),'a-t') + text(W-P-22,inner+20,archFit(m.storage.sub,40),'a-s','end');
    inner += 30 + 12;
  } else {
    hostsBlock += rect(P+12,inner,W-2*P-24,44,'#64748b',{fo:.1}) + text(W/2,inner+27,m.baseLabel,'a-t','middle'); hostCenters=[W/2];
    hostsBlock += line(W/2,laneBottom,W/2,inner); inner += 44 + 12;
  }
  // cargas
  let guestsBlock = '';
  if(m.guests.length){
    const gc = Math.min(4, m.guests.length), rows = Math.ceil(m.guests.length/gc), gw = (W-2*P-24-(gc-1)*8)/gc, gh = 68;
    guestsBlock += text(P+12,inner+12,g('Cargas em execução no cluster','Workloads running on the cluster','Cargas en ejecución en el clúster'),'a-s'); inner += 20;
    m.guests.forEach((x,i)=>{ const r=Math.floor(i/gc), c=i%gc, gx=P+12+c*(gw+8), gy=inner+r*(gh+8), ch=Math.floor((gw-14)/6.8);
      guestsBlock += rect(gx,gy,gw,gh,x.color,{fo:.12}) + text(gx+8,gy+20,archFit(x.title,Math.floor((gw-14)/8.8)),'a-t') + text(gx+8,gy+39,archFit(x.line1,ch),'a-s') + text(gx+8,gy+57,archFit(x.line2,ch),'a-s'); });
    inner += rows*(gh+8);
  }
  const frameH = inner - frameY + 4;
  body += rect(P,frameY,W-2*P,frameH,'#30ba78',{rx:12,fo:.03,sw:2}) + text(P+14,frameY+21,archFit(m.cluster ? m.cluster.title+' · '+m.cluster.sub : m.baseLabel,92),'a-t')
        + hostsBlock + guestsBlock;
  y = frameY + frameH + 20;
  body += text(P,y,g('Tracejado = fora da infraestrutura do cluster · cores nas faixas = redes','Dashed = outside the cluster infrastructure · lane colours = networks','Punteado = fuera de la infraestructura del clúster · colores de las franjas = redes'),'a-s');
  y += 8;
  return '<svg class="arch-svg" viewBox="0 0 '+W+' '+y+'" width="100%" role="img" aria-label="'+e(g('Arquitetura integrada','Integrated architecture','Arquitectura integrada'))+'" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
}

/* ---------------- TEST PLAN ---------------- */
function ensureTestCases(){
  const sp = state.selectedProducts;
  let changed = false;
  PRODUCTS.forEach(p=>{
    if(!sp[p.id]) return;
    const items = TEST_CATALOG.filter(it=>it.product===p.id);
    if(!items.length) return;
    const list = state.testCases[p.id] || (state.testCases[p.id] = []);
    items.forEach(it=>{
      if(!testApplies(it) || list.some(t=>t.catalogId===it.id) || state.testDismissed.indexOf(it.id)>=0) return;
      list.push({ id:uid(), catalogId:it.id, result:'pending', priority:it.tier, fit:it.unverified?'validate':'native', led:'', owner:'', evidence:'', notes:'' });
      changed = true;
    });
  });
  if(changed) saveState();
}

    + (order||Object.keys(map)).map(k=>'<option value="'+k+'" '+(value===k?'selected':'')+'>'+(map[k][L]||map[k].en)+'</option>').join('');
}

/* ---------------- SUMMARY / REPORT ----------------
   Relatório único, em ordem fixa (segue o formato dos documentos de PoC entregues a clientes
   + SUSE Virtualization PoC Guide v1.7.0). Credenciais ficam numa folha do operador separada. */
function summaryField(label, value){
  return '<div style="min-width:0;"><div class="text-xs text-muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:10px;">'+label+'</div><div style="font-size:13px;font-weight:600;margin-top:2px;overflow-wrap:anywhere;">'+ (value? esc(value) : '—') +'</div></div>';
}
/* O Chrome ignora "não quebrar depois" em linhas de tabela. Então a linha de grupo (fase, grupo de testes)
   vai num <tbody> junto com a linha seguinte, e esse bloco não se parte: o título nunca fica sozinho. */
function keepHeads(rowsHtml){
  const trs = rowsHtml.match(/<tr>[\s\S]*?<\/tr>(?=<tr>|$)/g) || [];
  let out = '', run = ''; const flush = ()=>{ if(run){ out += '<tbody>'+run+'</tbody>'; run = ''; } };
  for(let i=0;i<trs.length;i++){
    if(/grp-row/.test(trs[i].slice(0,160))){ flush(); out += '<tbody class="keep-head">'+trs[i]+(trs[i+1]||'')+'</tbody>'; i++; }
    else run += trs[i];
  }
  flush(); return out;
}
function summaryCard(icon, title, bodyHtml){
  const short = (bodyHtml.match(/<tr/g)||[]).length <= 14 && bodyHtml.length < 9000;   // cabe numa página: não parte o cartão
  return '<div class="card'+(short?' keep-together':'')+'">'
    + '<h3 style="font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--ink);">' + Icon(icon) + ' ' + title + '</h3>'
    + bodyHtml
  + '</div>';
}

/* --- helpers de rede --- */
function isIPv4(s){ s=(s||'').trim(); return /^\d{1,3}(\.\d{1,3}){3}$/.test(s) && s.split('.').every(o=>+o<=255); }
function cidrParse(c){
  const m=/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/.exec((c||'').trim());
  if(!m || !isIPv4(m[1]) || +m[2]>32) return null;
  const mask = +m[2]===0 ? 0 : (0xFFFFFFFF << (32-(+m[2]))) >>> 0;
  return { base:(ipToInt(m[1]) & mask)>>>0, mask };
}
function inCidr(ip, cidr){ const p=cidrParse(cidr); return !!p && isIPv4(ip) && ((ipToInt(ip.trim()) & p.mask)>>>0)===p.base; }
function addDaysISO(iso, days){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return '';
  return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]+days)).toISOString().split('T')[0];
}

    rows += '<tr><td colspan="3" class="text-xs grp-row" style="font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);">'+(++phaseNo)+'. '+esc(INSTALL_PHASES[ph][L]||INSTALL_PHASES[ph].en)+'</td></tr>';

function summaryTestsSection(L,g,sp){
  const active = PRODUCTS.filter(p=>sp[p.id] && state.testCases[p.id] && state.testCases[p.id].length);
  if(!active.length) return '<p class="text-xs text-muted">—</p>';

  const resPill = (r) => { const w = TEST_STATUS[r] ? r : 'pending'; return '<span class="pill" style="background:'+TEST_STATUS[w].color+';color:#fff;white-space:nowrap;letter-spacing:.04em;">'+resultWord(w,L)+'</span>'; };
  let html = executionBlockHtml(g) + summaryTestsOverview(L,g,sp)
    + '<div class="flex gap-2 flex-wrap mt-2 mb-2"><span class="pill pill-warn">must-have '+cov(st.must)+'</span>'+(st.nice.total?'<span class="pill pill-off">nice-to-have '+cov(st.nice)+'</span>':'')+''
    + '<span class="pill pill-bad">'+g('não atende','does not meet','no cumple')+' · '+(st.must.fail+st.nice.fail)+'</span><span class="pill pill-warn">'+g('parcial','partial','parcial')+' · '+(st.must.partial+st.nice.partial)+'</span><span class="pill pill-off">'+g('pendentes','pending','pendientes')+' · '+(st.must.pending+st.nice.pending)+'</span>'+(st.na?'<span class="pill pill-off">N/A · '+st.na+'</span>':'')+'</div>';
  active.forEach(p=>{
    const rows = orderedTests(p.id).filter(x=>testCounts(x.t));
    if(!rows.length) return;
    let lastGroup = '';
    html += '<div class="mt-3"><div class="text-xs" style="font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;"><span class="badge-dot" style="background:'+p.color+'"></span>'+p.name+'</div>'
      + '<table class="data-table multi mt-1" style="table-layout:fixed;width:100%;"><colgroup><col style="width:7%"><col style="width:22%"><col style="width:22%"><col style="width:15%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>'+g('Prior.','Prio.','Prior.')+'</th><th>'+g('Teste','Test','Prueba')+'</th><th>'+g('Resultado esperado','Expected result','Resultado esperado')+'</th><th>'+g('Status','Status','Estado')+'</th><th>'+g('Aderência · condução · responsável','Fit · led by · owner','Adherencia · conducción · responsable')+'</th><th>'+g('Evidência e notas','Evidence and notes','Evidencia y notas')+'</th></tr></thead>'
      + keepHeads(rows.map(x=>{
          const t=x.t, it=testItem(t); let grp='';
          if(testHasGroups(p.id) && it && it.group!==lastGroup){ lastGroup=it.group; grp='<tr><td colspan="6" class="text-xs grp-row" style="font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);">'+(TEST_GROUPS[it.group][L]||TEST_GROUPS[it.group].en)+'</td></tr>'; }
          const meta = [testMapLabel(TEST_FIT,t.fit,L), testMapLabel(TEST_LED,t.led,L), t.owner].filter(Boolean).map(esc).join('<br>');
          return grp+'<tr><td><span class="pill '+(testPriority(t)==='must'?'pill-warn':'pill-off')+'">'+(testPriority(t)==='must'?'must':'nice')+'</span></td><td class="text-xs" style="font-weight:700;">'+esc(testTitle(t,L))+(it&&it.guide?' <span class="text-muted">'+esc(it.guide)+'</span>':'')+(it&&it.unverified?' <span class="text-muted">('+g('não confirmado','unverified','no confirmado')+')</span>':'')+(!it?' <span class="text-muted">('+g('específico','specific','específico')+')</span>':'')+'</td><td class="text-xs text-muted">'+esc(testExpected(t,L))+'</td><td>'+resPill(t.result)+'</td><td class="text-xs">'+(meta||'<span class="text-muted">—</span>')+'</td><td class="text-xs">'+esc(t.evidence||'')+(t.notes?'<div class="text-muted">'+esc(t.notes)+'</div>':'')+'</td></tr>';
        }).join('')) + '</table></div>';
  });
  return html;
}

/* Riscos e pendências: derivados do que já foi coletado, sem entrada nova. */
function summaryRisksSection(L,g,sp,readiness){
  const rows=[];
  /* Pendências de prontidão (gap/confirm) já estão na tabela de prontidão logo acima; aqui só entra o que não está lá. */
  let pendPorts=0; PRODUCTS.filter(p=>sp[p.id]&&PORT_REQUIREMENTS[p.id]).forEach(p=>PORT_REQUIREMENTS[p.id].forEach((r,i)=>{ if(!state.ports.checked[p.id+'-'+i]) pendPorts++; }));
  pendPorts += hostsProgress().t - hostsProgress().d;
  if(pendPorts) rows.push({sev:'med', src:g('Portas','Ports','Puertos'), text:pendPorts+' '+g('regra(s) de firewall ainda não liberada(s)','firewall rule(s) not yet opened','regla(s) de firewall aún no habilitada(s)')});
  const pendSteps = installSteps().filter(s=>!state.installProgress[s.id]).length;
  if(pendSteps) rows.push({sev:'low', src:g('Instalação','Install','Instalación'), text:pendSteps+' '+g('etapa(s) do runbook não concluída(s)','runbook step(s) not completed','etapa(s) del runbook no concluida(s)')});
  const ts = testStats(sp), T = g('Testes','Tests','Pruebas');
  if(ts.must.fail) rows.push({sev:'high', src:T, text:ts.must.fail+' '+g('teste(s) must-have reprovado(s)','must-have test(s) failed','prueba(s) must-have fallida(s)')});
  if(ts.nice.fail) rows.push({sev:'med', src:T, text:ts.nice.fail+' '+g('teste(s) nice-to-have reprovado(s)','nice-to-have test(s) failed','prueba(s) nice-to-have fallida(s)')});
  if(ts.must.partial) rows.push({sev:'med', src:T, text:ts.must.partial+' '+g('teste(s) must-have parcial(is)','must-have test(s) partial','prueba(s) must-have parcial(es)')});
  if(ts.nice.partial) rows.push({sev:'low', src:T, text:ts.nice.partial+' '+g('teste(s) nice-to-have parcial(is)','nice-to-have test(s) partial','prueba(s) nice-to-have parcial(es)')});
  if(ts.must.pending) rows.push({sev:'med', src:T, text:ts.must.pending+' '+g('teste(s) must-have ainda pendente(s)','must-have test(s) still pending','prueba(s) must-have aún pendiente(s)')});
  if(ts.nice.pending) rows.push({sev:'low', src:T, text:ts.nice.pending+' '+g('teste(s) nice-to-have ainda pendente(s)','nice-to-have test(s) still pending','prueba(s) nice-to-have aún pendiente(s)')});
  if(!rows.length && readiness.some(i=>i.status!=='ok')) return '<p class="text-xs text-muted">'+g('Sem outros riscos além dos itens de prontidão acima.','No other risks beyond the readiness items above.','Sin otros riesgos además de los ítems de preparación anteriores.')+'</p>';
  if(!rows.length) return '<div class="alert alert-ok">'+Icon('check')+' '+g('Nenhuma pendência identificada.','No open items identified.','Ningún punto pendiente identificado.')+'</div>';
  const sev={high:['pill-bad',g('Alto','High','Alto')], med:['pill-warn',g('Médio','Medium','Medio')], low:['pill-off',g('Baixo','Low','Bajo')]};
  const order={high:0,med:1,low:2};
  rows.sort((a,b)=>order[a.sev]-order[b.sev]);
  return '<table class="data-table"><thead><tr><th>'+g('Severidade','Severity','Severidad')+'</th><th>'+g('Origem','Source','Origen')+'</th><th>'+g('Pendência / risco','Open item / risk','Punto pendiente / riesgo')+'</th></tr></thead><tbody>'
    + rows.map(r=>'<tr><td><span class="pill '+sev[r.sev][0]+'">'+sev[r.sev][1]+'</span></td><td class="text-xs">'+r.src+'</td><td class="text-xs">'+r.text+'</td></tr>').join('') + '</tbody></table>';
}

  html += '<div class="day-sheet">' + buildDaySheetHtml(g) + '</div>';

  return html;
}

/* ===================== GLOBAL NAMESPACE (event handlers) ===================== */
/* ---------------- CONECTOR (poc-control, opcional) ----------------
   Só liga quando a página é servida por um servidor poc-control (mesma origem) que responde ao
   `GET /api/planner/capabilities`. Aberta de arquivo (file://) ou de qualquer outro servidor, não faz
   chamada alguma e nada muda (R2). Nada vai ao servidor sem um clique: a detecção é um GET sem corpo
   e os demais recursos (importar documento, sugerir aderência) só enviam quando o usuário aciona.
   Tudo o que volta é tratado como hostil: lista de chaves permitidas, ids conferidos contra o catálogo
   do próprio planner, nada de credenciais, e só entra no projeto depois da tela de revisão (R7). */
const CONNECTOR_BASE = '/api/planner';
const CONNECTOR_FEATURES = ['hydrate','feasibility','procedures','execution','history','draft'];
let connector = { status:'off', features:[] };
let connectorIO = (typeof fetch==='function') ? (url,opts)=>fetch(url,opts) : null;   // trocável nos testes
function connectorEligible(){ return !!connectorIO && typeof location!=='undefined' && (location.protocol==='http:' || location.protocol==='https:'); }
function connectorHas(f){ return connector.status==='on' && connector.features.indexOf(f)>=0; }
function connectorParseCaps(j){
  if(!isPlainObject(j) || j.kind!=='poc-control' || j.schema!==1 || !Array.isArray(j.features)) return null;
  return { status:'on', features:j.features.filter(f=>CONNECTOR_FEATURES.indexOf(f)>=0) };
}
function connectorProbe(){
  if(!connectorEligible()) return Promise.resolve(connector);
  return connectorIO(CONNECTOR_BASE+'/capabilities', { credentials:'same-origin', headers:{ Accept:'application/json' } })
    .then(r=>r.ok ? r.json() : null).catch(()=>null)
    .then(j=>{
      const c = connectorParseCaps(j) || { status:'off', features:[] };
      const changed = c.status!==connector.status || c.features.join()!==connector.features.join();
      connector = c; if(changed) render();
      checkExecutionLink();
      return connector;
    });
}
function connectorJson(r){
  if(r.status===401) throw { code:'auth' };
  if(!r.ok){
    // FastAPI's HTTPException always answers {"detail": "..."} -- interpretar_erro_gemini's
    // actual message (which tells you whether to retry, check your key, etc.) was getting
    // thrown away here in favor of a bare "(502)", leaving the person with no idea what to do.
    return r.json().catch(function(){ return null; }).then(function(body){
      throw { code:'http', status:r.status, detail: (body && typeof body.detail==='string') ? body.detail : null };
    });
  }
  return r.json();
}
function connectorSend(path, init){
  const ctl = (typeof AbortController==='function') ? new AbortController() : null;
  // Tem que ser >= o proxy_read_timeout do nginx (poc-control/web/nginx.conf, 300s) -- menor que
  // isso, o navegador desiste da chamada de IA (importar documento etc.) antes do servidor, e o
  // erro genérico de rede escondia que era só demora, não uma falha real.
  const timer = ctl ? setTimeout(()=>ctl.abort(), 300000) : null;
  return connectorIO(CONNECTOR_BASE+path, Object.assign({ method:'POST', credentials:'same-origin', headers:{ Accept:'application/json' } }, init, ctl ? { signal:ctl.signal } : {}))
    .then(connectorJson).then(j=>{ if(timer) clearTimeout(timer); return j; }, e=>{ if(timer) clearTimeout(timer); throw e; });
}
function connectorErrorText(e, g){
  if(e && e.code==='auth') return g('Sessão do poc-control expirada: entre novamente no servidor e tente de novo.','The poc-control session expired: sign in to the server again and retry.','La sesión de poc-control expiró: vuelva a iniciar sesión en el servidor e intente de nuevo.');
  if(e && e.code==='http') return e.detail || g('O servidor respondeu com erro ('+e.status+').','The server answered with an error ('+e.status+').','El servidor respondió con error ('+e.status+').');
  if(e && e.name==='AbortError') return g('A IA demorou demais pra responder (mais de 5 minutos) e a chamada foi cancelada. Tente de novo ou com um documento menor.','The AI took too long to respond (over 5 minutes) and the request was cancelled. Try again or with a smaller document.','La IA tardó demasiado en responder (más de 5 minutos) y la solicitud fue cancelada. Intente de nuevo o con un documento más pequeño.');
  return g('Não foi possível falar com o servidor.','Could not reach the server.','No fue posible comunicarse con el servidor.');
}
/* Senhas coladas num e-mail não deveriam chegar ao Gemini. Máscara local, só para texto colado (arquivo não dá). */
function redactSecrets(text){
  let n = 0; const mask = (m,a)=>{ n++; return a+'[REDACTED]'; };
  const s = String(text||'')
    .replace(/(\b(?:senha|password|passwd|pwd|passphrase|token|secret|segredo|api[_ -]?key|chave(?: de api)?)\b\s*(?:é|is|:|=)\s*)(?:"[^"\n]*"|'[^'\n]*'|\S+)/gi, mask)
    .replace(/([a-z][a-z0-9+.-]*:\/\/[^\/\s:@]+:)[^@\s\/]+(?=@)/gi, mask);
  return { text:s, count:n };
}
function connectorCatalog(){
  const L = state.lang;
  return { lang:L, products:PRODUCTS.map(p=>p.id), tests:TEST_CATALOG.map(x=>({ id:x.id, product:x.product, title:x.t[L]||x.t.en })) };
}

/* --- Importar documento do cliente: contrato {kind:'suse-poc-hydration', schema:1, project, network, selectedProducts, tests} --- */
const HYD_FIELDS = {
  'project.projectName':{ max:120, label:{pt:'Nome do projeto',en:'Project name',es:'Nombre del proyecto'} },
  'project.clientOrganization':{ max:120, label:{pt:'Cliente',en:'Client',es:'Cliente'} },
  'project.organization':{ max:120, label:{pt:'Organização',en:'Organization',es:'Organización'} },
  'project.leadEngineer':{ max:120, label:{pt:'Engenheiro responsável',en:'Lead engineer',es:'Ingeniero responsable'} },
  'project.leadEmail':{ max:120, check:v=>/^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(v), label:{pt:'E-mail do responsável',en:'Lead email',es:'E-mail del responsable'} },
  'project.targetDate':{ max:10, check:v=>/^\d{4}-\d{2}-\d{2}$/.test(v), label:{pt:'Data alvo',en:'Target date',es:'Fecha objetivo'} },
  'project.presalesUseCase':{ max:600, label:{pt:'Caso de uso',en:'Use case',es:'Caso de uso'} },
  'project.businessIssue':{ max:600, label:{pt:'Problema de negócio',en:'Business issue',es:'Problema de negocio'} },
  'project.targetInfrastructure':{ max:600, label:{pt:'Ambiente alvo',en:'Target environment',es:'Entorno objetivo'} },
  'network.managementCidr':{ max:18, check:v=>/^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/.test(v) && ipv4Ok(v.split('/')[0]) && +v.split('/')[1]<=32, label:{pt:'CIDR de gerenciamento',en:'Management CIDR',es:'CIDR de gestión'} },
  'network.gatewayIp':{ max:15, check:ipv4Ok, label:{pt:'Gateway',en:'Gateway',es:'Gateway'} },
  'network.clusterVip':{ max:15, check:ipv4Ok, label:{pt:'VIP do cluster',en:'Cluster VIP',es:'VIP del clúster'} },
  'network.ipPoolStart':{ max:15, check:ipv4Ok, label:{pt:'Início do pool de IPs',en:'IP pool start',es:'Inicio del pool de IPs'} },
  'network.ipPoolEnd':{ max:15, check:ipv4Ok, label:{pt:'Fim do pool de IPs',en:'IP pool end',es:'Fin del pool de IPs'} },
  // Texto livre (hostname ou IP, um valor ou lista) -- sem "check" de formato, mesmo tratamento
  // dos campos de texto livre do projeto (presalesUseCase etc.), não dos campos de IP estrito acima.
  'network.ntpServers':{ max:200, label:{pt:'Servidor(es) NTP',en:'NTP server(s)',es:'Servidor(es) NTP'} },
  'network.dnsServers':{ max:200, label:{pt:'Servidor(es) DNS',en:'DNS server(s)',es:'Servidor(es) DNS'} }
};
function ipv4Ok(v){ return /^(\d{1,3}\.){3}\d{1,3}$/.test(v) && v.split('.').every(o=>+o<=255); }
function hostnameOk(v){ return /^[A-Za-z0-9.\-_]{1,255}$/.test(v); }
// VM "produto" -> chave de produto em state.network.vms: security/storage/registry/appcollection
// compartilham um único VM "addons" (ver rebuildVms()), os demais usam o próprio id do produto.
function vmProductKey(produto){ return ['security','storage','registry','appcollection'].indexOf(produto)>=0 ? 'addons' : produto; }
function hydText(v, max){ return typeof v==='string' ? v.replace(/[\u0000-\u001f\u007f]+/g,' ').replace(/ {2,}/g,' ').trim().slice(0,max) : ''; }
/* Resposta do servidor -> lista de sugestões validadas. Qualquer chave fora da lista (inclusive qualquer coisa de
   credenciais) é ignorada: nunca é lida. Produtos e testes só entram se existirem no catálogo daqui. */
function hydrationClean(resp, st){
  if(!isPlainObject(resp) || resp.kind!=='suse-poc-hydration' || resp.schema!==1) return null;
  const items = [];
  Object.keys(HYD_FIELDS).forEach(key=>{
    const parts = key.split('.'), src = isPlainObject(resp[parts[0]]) ? resp[parts[0]] : {};
    const spec = HYD_FIELDS[key], v = hydText(src[parts[1]], spec.max);
    if(!v || (spec.check && !spec.check(v))) return;
    items.push({ kind:'field', key, value:v, label:spec.label, current:String(getPath(st, key)||'') });
  });
  const sp = isPlainObject(resp.selectedProducts) ? resp.selectedProducts : {};
  PRODUCTS.forEach(p=>{ if(sp[p.id]===true) items.push({ kind:'product', key:'selectedProducts.'+p.id, value:true, label:{pt:p.name,en:p.name,es:p.name}, current:st.selectedProducts[p.id] ? 'on' : '' }); });
  const seen = {};
  (Array.isArray(resp.tests) ? resp.tests : []).slice(0,200).forEach(t=>{
    if(!isPlainObject(t) || typeof t.id!=='string' || !TEST_BY_ID[t.id] || seen[t.id]) return;
    seen[t.id] = 1;
    items.push({ kind:'test', key:'tests.'+t.id, value:hydText(t.reason, 300), label:TEST_BY_ID[t.id].t, current:'' });
  });
  // Máquinas: a posição de cada entrada dentro do seu produto é guardada no key (ex. "vms.virtualization.1"),
  // porque o documento não conhece o `key` interno do state (ex. "virtualization-0") -- esse casamento só
  // acontece em hydrationApply, depois que os produtos aceitos já recriaram os slots de VM (rebuildVms()).
  // Por isso não dá pra mostrar "atual" aqui: o slot de destino ainda não existe neste momento.
  const porProduto = {};
  (Array.isArray(resp.vms) ? resp.vms : []).slice(0,100).forEach(m=>{
    if(!isPlainObject(m) || !PRODUCTS.some(p=>p.id===m.product)) return;
    const hostname = hostnameOk(hydText(m.hostname,255)) ? hydText(m.hostname,255) : '';
    const ip = ipv4Ok(m.ip) ? m.ip : '';
    if(!hostname && !ip) return;
    const idx = porProduto[m.product] = (porProduto[m.product]||0);
    porProduto[m.product] = idx+1;
    const prod = PRODUCTS.filter(p=>p.id===m.product)[0];
    const nome = prod ? prod.name : m.product;
    items.push({ kind:'vm', key:'vms.'+m.product+'.'+idx, value:{hostname,ip},
      label:{pt:nome+' — máquina '+(idx+1),en:nome+' — machine '+(idx+1),es:nome+' — máquina '+(idx+1)}, current:'' });
  });
  return items;
}
/* Aplica o que o usuário aceitou. Produtos e campos primeiro, depois o plano de testes (semeado já com os produtos novos). */
function hydrationApply(items, accepted){
  let skipped = 0;
  const ok = items.filter(it=>accepted[it.key]);
  ok.filter(it=>it.kind==='field').forEach(it=>setPath(state, it.key, it.value));
  ok.filter(it=>it.kind==='product').forEach(it=>{ state.selectedProducts[it.key.split('.')[1]] = true; });
  // Precisa rodar depois dos produtos acima: é isso que cria os slots de VM que os itens 'vm'
  // abaixo vão casar por posição (ver hydrationClean -- o documento não conhece o `key` interno
  // de cada VM). Se o número de máquinas extraídas do documento for maior que o nodeCount padrão
  // do produto, o excedente fica sem slot e é contado em `skipped` -- nodeCount é dimensionamento,
  // que fica manual por design (R7), então não é ajustado automaticamente aqui.
  rebuildVms();
  ok.filter(it=>it.kind==='vm').forEach(it=>{
    const parts = it.key.split('.'), produto = parts[1], idx = +parts[2];
    const vm = (state.network.vms||[]).filter(v=>v.product===vmProductKey(produto))[idx];
    if(!vm){ skipped++; return; }
    if(it.value.hostname) vm.hostname = it.value.hostname;
    if(it.value.ip) vm.ip = it.value.ip;
  });
  const tests = ok.filter(it=>it.kind==='test');
  tests.forEach(it=>{ const i = state.testDismissed.indexOf(it.key.slice(6)); if(i>=0) state.testDismissed.splice(i,1); });
  ensureTestCases();
  tests.forEach(it=>{
    const cid = it.key.slice(6), t = ((state.testCases[TEST_BY_ID[cid].product]||[]).filter(x=>x.catalogId===cid))[0];
    if(!t){ skipped++; return; }
    t.priority = 'must'; t.origin = 'doc'; if(it.value) t.originNote = it.value;
  });
  return { applied: ok.length - skipped, skipped };
}

/* --- Aderência sugerida por pesquisa na web: contrato {kind:'suse-poc-feasibility', schema:1, results:[{id, fit, rationale, sources}]} --- */
function feasibilityClean(resp){
  if(!isPlainObject(resp) || resp.kind!=='suse-poc-feasibility' || resp.schema!==1 || !Array.isArray(resp.results)) return null;
  const out = {};
  resp.results.slice(0,100).forEach(r=>{
    if(!isPlainObject(r) || typeof r.id!=='string' || !TEST_FIT[r.fit]) return;
    const sources = (Array.isArray(r.sources) ? r.sources : []).slice(0,5).map(s=>{
      const url = isPlainObject(s) && typeof s.url==='string' ? s.url.trim() : '';
      return /^https?:\/\/[^\s"'<>]+$/i.test(url) && url.length<=500 ? { title:hydText(s.title,150)||url, url } : null;
    }).filter(Boolean);
    out[r.id] = { fit:r.fit, rationale:hydText(r.rationale,600), sources, source:'web' };
  });
  return out;
}
function testByCaseId(id){
  for(const pid in state.testCases){ const i = (state.testCases[pid]||[]).findIndex(t=>t.id===id); if(i>=0) return state.testCases[pid][i]; }
  return null;
}
let fitBusy = {}, fitError = '';
function suggestFitWeb(productId, i){
  const t = (state.testCases[productId]||[])[i]; if(!t || fitBusy[t.id] || !connectorHas('feasibility')) return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en;
  fitBusy[t.id] = true; fitError = ''; render();
  const body = { lang:L, fits:Object.keys(TEST_FIT), tests:[{ id:t.id, product:productId, title:testTitle(t,L), expected:testExpected(t,L) }] };

    .then(j=>{

    })
    .catch(e=>{ fitError = e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.') : connectorErrorText(e,g); })
    .then(()=>{ delete fitBusy[t.id]; render(); });
}
/* Rascunho guiado por IA pra um teste sem procedimento que sirva, POST /api/planner/procedure-draft
   (ver app/planner/router.py::procedure_draft). A resposta tem a MESMA forma de uma linha+detalhe de
   /api/procedimentos, então entra na biblioteca local pelos conversores que o servidor já usa
   (serverProcClean/serverProcToLib) -- sem parser novo nenhum. Conteúdo sempre em português (regra do
   projeto para o que a IA gera), independente do idioma da tela (L): só o título do catálogo e o
   resultado esperado precisam ir em pt pro Gemini, nunca o que a UI mostra em en/es. */
let draftBusy = {}, draftError = '';
function generateProcedureDraft(productId, i){
  const t = (state.testCases[productId]||[])[i]; if(!t || draftBusy[t.id] || !connectorHas('draft')) return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en, pr = state.project;
  draftBusy[t.id] = true; draftError = ''; render();
  const body = { test:{ id:t.catalogId||t.id, product:productId, title:testTitle(t,'pt'), expected:testExpected(t,'pt') },
    client: pr.clientOrganization || '', scope: [pr.presalesUseCase, pr.businessIssue, pr.targetInfrastructure].filter(Boolean).join(' ') };
  return connectorSend('/procedure-draft', { headers:{ 'Content-Type':'application/json', Accept:'application/json' }, body:JSON.stringify(body) })
    .then(j=>{
      const rows = serverProcClean([j]);
      if(!rows || !rows[0]) throw { code:'shape' };
      const rec = serverProcToLib(rows[0], j);
      if(!rec) throw { code:'shape' };
      const res = libraryImportData({ procedures:[rec] });
      if(res.error) throw { code:'storage', error:res.error };
      if(!res.added && !res.skipped) throw { code:'shape' };
      t.procId = rec.id; t.procVersion = rec.version; procPicker = null; saveState();
    })
    .catch(e=>{
      draftError = e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.')
        : e && e.code==='storage' ? (e.error==='quota' ? libraryQuotaText() : libraryErrorText())
        : connectorErrorText(e,g);
    })
    .then(()=>{ delete draftBusy[t.id]; render(); });
}

/* --- Aderência sugerida pelo histórico (ADR 1): GET /api/planner/history?ids=...
   Só envia ids de teste do catálogo, e só quando a pessoa clica. Vem antes da pesquisa na web: se este teste já rodou sem
   problemas em outras PoCs, a categoria mais nativa dessas execuções vira sugestão (nunca é aplicada sozinha, R7). --- */
let histState = { busy:false, notice:null };
function historyClean(resp, ids){
  if(!isPlainObject(resp) || resp.kind!=='suse-poc-history' || resp.schema!==1 || !isPlainObject(resp.results)) return null;
  const out = {};
  ids.forEach(id=>{
    const r = Object.prototype.hasOwnProperty.call(resp.results, id) ? resp.results[id] : null;
    if(!isPlainObject(r)) return;
    const runs = Number.isInteger(r.runs) && r.runs>=0 && r.runs<=1000000 ? r.runs : 0;
    const successes = Number.isInteger(r.successes) && r.successes>=0 && r.successes<=runs ? r.successes : 0;
    const fit = typeof r.suggestedFit==='string' && TEST_FIT[r.suggestedFit] ? r.suggestedFit : null;
    out[id] = { runs:runs, successes:successes, fit:successes>0 ? fit : null };
  });
  return out;
}
function suggestFitHistory(){
  if(histState.busy || !connectorHas('history')) return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en, tests = [];
  Object.keys(state.testCases).filter(pid=>state.selectedProducts[pid]).forEach(pid=>(state.testCases[pid]||[]).forEach(t=>{ if(t.catalogId && testCounts(t)) tests.push(t); }));
  const ids = Array.from(new Set(tests.map(t=>t.catalogId))), chunks = [];
  for(let i=0;i<ids.length;i+=200) chunks.push(ids.slice(i,i+200));
  histState = { busy:true, notice:null }; render();
  const found = {};
  return chunks.reduce((chain,c)=>chain.then(()=>connectorIO('/api/planner/history?ids='+encodeURIComponent(c.join(',')), { credentials:'same-origin', headers:{ Accept:'application/json' } })
      .then(connectorJson).then(j=>{ const r = historyClean(j,c); if(!r) throw { code:'shape' }; Object.assign(found,r); })), Promise.resolve())
    .then(()=>{
      let n = 0;
      tests.forEach(t=>{
        const h = found[t.catalogId]; if(!h || !h.fit || t.fit===h.fit) return;
        t.fitSuggestion = { fit:h.fit, rationale:'', sources:[], source:'history', runs:h.runs, successes:h.successes }; n++;
      });
      saveState();
      histState.notice = n ? { kind:'ok', text:n+' '+g('sugestão(ões) do histórico; confirme ou descarte em cada teste.','suggestion(s) from history; confirm or dismiss on each test.','sugerencia(s) del historial; confirme o descarte en cada prueba.') }

/* --- Procedimentos do servidor na mesma lista da biblioteca (só leitura: GET /api/procedimentos e
   GET /api/procedimentos/<uuid>) --- Nada da biblioteca local é enviado. Ao entrar na tela (go('library')),
   a lista do servidor é buscada sozinha; cada item que ainda não está na biblioteca local aparece na MESMA
   lista, com uma tag "Servidor" em vez de "Local" (renderLibraryList). Abrir um item com tag "Servidor" importa
   e abre num só clique -- o HTML vindo do servidor é tratado como qualquer arquivo importado, passa pelo
   sanitizador em libraryImportData. O servidor não tem família nem produto: a família vem do título e os
   produtos são um palpite (guessProducts) sobre título e tags, editável na biblioteca depois de importado. */
const SERVER_PROC_BASE = '/api/procedimentos';
let serverProcs = { phase:'idle', rows:[], error:'', openingSid:'' };
function serverProcId(uuid){ return 'srv-'+String(uuid).toLowerCase(); }   // 4 + 36 = 40: cabe em procSafeId
function serverProcClean(arr){
  if(!Array.isArray(arr)) return null;
  return arr.slice(0,500).map(r=>{
    if(!isPlainObject(r) || typeof r.id!=='string' || !isUuid(r.id) || typeof r.titulo!=='string') return null;
    return { sid:r.id.toLowerCase(), title:procClampStr(r.titulo,200).trim() || 'Sem título', version:Math.max(1, parseInt(r.versao,10)||1),
      status:PROC_STATUS.indexOf(r.status)>=0 ? r.status : 'rascunho', client:procClampStr(r.cliente_origem,120),
      date:/^\d{4}-\d{2}-\d{2}/.test(r.data_origem||'') ? r.data_origem.slice(0,10) : '',
      tags:(Array.isArray(r.tags) ? r.tags : []).filter(t=>typeof t==='string').map(t=>procClampStr(t.trim(),40)).filter(Boolean).slice(0,30) };
  }).filter(Boolean);
}
function serverProcSlug(title){ return userSlug(title).slice(0,30) || 'proc'; }
/* Detalhe do servidor + linha da listagem -> registro do arquivo de biblioteca (o HTML é sanitizado na importação). */
function serverProcToLib(row, detail){
  if(!isPlainObject(detail) || typeof detail.html_original!=='string' || !detail.html_original || detail.html_original.length>PROC_MAX_BYTES) return null;
  return { id:serverProcId(row.sid), family:'srvf-'+serverProcSlug(row.title), title:row.title, products:guessProducts(row.title+' '+row.tags.join(' ')),
    tags:row.tags, sourceClient:row.client, date:row.date, status:row.status, version:row.version, html:detail.html_original };
}
function serverProcsLoad(){
  if(!connectorHas('procedures') || serverProcs.phase==='loading') return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en;
  serverProcs = { phase:'loading', rows:[], error:'', openingSid:'' }; render();
  return connectorIO(SERVER_PROC_BASE, { credentials:'same-origin', headers:{ Accept:'application/json' } }).then(connectorJson)
    .then(j=>{ const rows = serverProcClean(j); if(!rows) throw { code:'shape' }; serverProcs.rows = rows; serverProcs.phase = 'list'; })
    .catch(e=>{ serverProcs.phase = 'idle'; serverProcs.error = e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.') : connectorErrorText(e,g); })
    .then(()=>render());
}
/* Importa só a linha clicada e já abre -- um clique, não um seletor em lote. Idempotente: se já estiver na
   biblioteca local (mesmo id srv-<uuid>), libraryImportData só ignora e ainda assim abre. */
function serverProcOpen(sid){
  const sp = serverProcs, row = sp.rows.filter(r=>r.sid===sid)[0];
  if(!row || sp.openingSid) return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en;
  sp.openingSid = sid; libraryNotice = null; render();
  return connectorIO(SERVER_PROC_BASE+'/'+sid, { credentials:'same-origin', headers:{ Accept:'application/json' } }).then(connectorJson)
    .then(d=>{
      const o = serverProcToLib(row, d);
      if(!o) throw { code:'shape' };
      const res = libraryImportData({ procedures:[o] });
      if(res.added || res.skipped) libraryOpenId = o.id;
      else libraryNotice = libraryImportDataNotice(res);
    })
    .catch(e=>{ libraryNotice = { kind:'warn', text: e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.') : connectorErrorText(e,g) }; })
    .then(()=>{ sp.openingSid = ''; render(); window.scrollTo(0,0); });
}

/* --- Habilitar / abrir a execução no poc-control ---
   Manda o plano ao POST /api/pocs/importar-planejador que o servidor já tem, mas SEM o que o planejador guarda de
   sensível: credenciais, o objeto `eib` derivado, URLs/proxy com segredo, evidências, notas e observações de instalação.
   O que atravessa de volta é só o id da execução (state.pocControlId). */
function executionPayload(){
  rebuildVms();
  const st = JSON.parse(JSON.stringify(state));
  st.credentials = defaultState().credentials; st.pocControlId = ''; st.installNotes = {};
  (st.network.vms||[]).forEach(v=>{ v.user = ''; v.password = ''; });   // a senha de cada VM mora aqui (vira ROOT_PASS no export), não em `credentials`
  ['httpProxy','httpsProxy'].forEach(k=>{ if(urlHasSecret(st.network[k])) st.network[k] = ''; });
  ['sshKeysUrl','configUrl'].forEach(k=>{ if(urlHasSecret(st.virtInstall[k])) st.virtInstall[k] = ''; });
  Object.keys(st.testCases).forEach(pid=>(st.testCases[pid]||[]).forEach(t=>{ t.evidence = ''; t.notes = ''; delete t.fitSuggestion; delete t.originNote; delete t.procValues; }));
  return { schema:EXPORT_SCHEMA, planner:st, tests:executionTests(st) };
}
/* Lista plana dos testes do plano para o servidor criar os itens de execução SEM adivinhar (e sem IA): os testes do
   catálogo só carregam `catalogId` no estado, então título e resultado esperado vão resolvidos, no idioma da tela.
   Sem evidências, notas nem nada de credencial. Só entra o que conta no plano (produto selecionado e aplicável). */
function executionTests(st){
  const L = state.lang, out = [];
  PRODUCTS.filter(p=>st.selectedProducts[p.id]).forEach(p=>(st.testCases[p.id]||[]).forEach(t=>{
    if(!testCounts(t)) return;
    const title = (testTitle(t,L)||'').trim(); if(!title) return;
    out.push({ id:t.id, catalogId:t.catalogId||'', product:p.id, productName:p.name, title:procClampStr(title,300), expected:procClampStr(testExpected(t,L),600),
      priority:testPriority(t), fit:t.fit||'', fitSource:(t.fit && (t.fitSource==='web' || t.fitSource==='history')) ? t.fitSource : '', led:t.led||'', result:TEST_STATUS[t.result] ? t.result : 'pending', owner:procClampStr(t.owner||'',120) });
  }));
  return out;
}
let execFlow = { busy:false, error:'' };
function execEnable(){
  if(!connectorHas('execution') || execFlow.busy || state.pocControlId) return;
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en, fd = new FormData();
  fd.append('texto', JSON.stringify(executionPayload()));
  execFlow = { busy:true, error:'' }; render();
  return connectorIO('/api/pocs/importar-planejador', { method:'POST', credentials:'same-origin', headers:{ Accept:'application/json' }, body:fd }).then(connectorJson)
    .then(j=>{ if(!isPlainObject(j) || !isUuid(j.id)) throw { code:'shape' }; state.pocControlId = j.id.toLowerCase(); saveState(); })
    .catch(e=>{ execFlow.error = e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.') : connectorErrorText(e,g); })
    .then(()=>{ execFlow.busy = false; render(); });

/* A execução ligada ao projeto pode ter sido excluída no servidor (ADR 4: só o dono exclui). Em vez de mandar a pessoa
   para um 404, o planejador confere uma vez por id (GET da própria execução, mesma origem, só leitura) e, se ela não existe
   mais, avisa de forma neutra e oferece desvincular. Estado só de tela: não entra no projeto. Sem servidor, nada é checado. */

  const id = state.pocControlId;

  return connectorIO('/api/pocs/'+encodeURIComponent(id), { credentials:'same-origin', headers:{ Accept:'application/json' } })
    .then(r=>{ execCheck.status = r.status===404 ? 'gone' : (r.ok ? 'ok' : 'unknown'); })
    .catch(()=>{ execCheck.status = 'unknown'; })
    .then(()=>{ if(execCheck.id===state.pocControlId) render(); });
}

let importFlow = { phase:'form', error:'', items:[], accepted:{}, redacted:0, file:null, text:'' };
function importReset(){ importFlow = { phase:'form', error:'', items:[], accepted:{}, redacted:0, file:null, text:'' }; }
function importSend(){
  const L = state.lang, g = (pt,en,es)=>({pt,en,es})[L] || en;
  const f = importFlow; if(f.phase==='sending' || !connectorHas('hydrate')) return;
  if(!f.file && !f.text.trim()){ f.error = g('Escolha um arquivo ou cole o texto.','Choose a file or paste the text.','Elija un archivo o pegue el texto.'); render(); return; }
  const red = redactSecrets(f.text), fd = new FormData();
  if(f.file) fd.append('arquivo', f.file);
  if(red.text.trim()) fd.append('texto', red.text);
  fd.append('catalogo', JSON.stringify(connectorCatalog()));
  f.phase = 'sending'; f.error = ''; f.redacted = red.count; render();
  return connectorSend('/hydrate', { body:fd })
    .then(j=>{
      const items = hydrationClean(j, state);
      if(!items) throw { code:'shape' };
      f.items = items; f.accepted = {}; items.forEach(it=>{ f.accepted[it.key] = true; });
      f.phase = items.length ? 'review' : 'form';
      if(!items.length) f.error = g('Nada utilizável foi encontrado no documento.','Nothing usable was found in the document.','No se encontró nada utilizable en el documento.');
    })
    .catch(e=>{ f.phase = 'form'; f.error = e && e.code==='shape' ? g('Resposta do servidor em formato inesperado.','Unexpected server response.','Respuesta del servidor con formato inesperado.') : connectorErrorText(e,g); })
    .then(()=>render());
}

  /* ---- biblioteca de procedimentos ---- */
  libNew(){ libraryForm = { id:null, draft:draftBlank(), errors:[] }; libraryOpenId = null; libraryNotice = null; render(); window.scrollTo(0,0); },
  libEditAuthored(id){ const p = loadLibrary().filter(x=>x.id===id)[0]; if(!p || !p.authored) return; libraryForm = { id:id, draft:draftNormalize(p.authored), errors:[] }; libraryNotice = null; render(); window.scrollTo(0,0); },
  libFormCancel(){ libraryForm = null; render(); window.scrollTo(0,0); },
  libFormSave: libraryFormSave,
  libFormSet(path, value){
    const f = libraryForm; if(!f) return; value = String(value==null ? '' : value); let m;
    if(/^(title|client|tags|overview|highlights|cleanup|evidence)$/.test(path)) f.draft[path] = value;
    else if((m = /^(values|steps|errors)\.(\d{1,2})\.(name|description|example|source|title|commands|expected|symptom|cause|action)$/.exec(path))){
      const row = f.draft[m[1]][+m[2]]; if(!row || !Object.prototype.hasOwnProperty.call(row, m[3])) return;
      if(m[3]==='name') value = value.replace(/[<>]/g,'').trim().toUpperCase().replace(/[\s-]+/g,'_').slice(0,40);
      if(m[3]==='source' && !phSourceOk(value)) return;
      row[m[3]] = value;
    } else return;
    render();
  },
  libFormAdd(kind){
    const f = libraryForm, blank = { values:{ name:'', description:'', example:'', source:'session' }, steps:{ title:'', commands:'', expected:'' }, errors:{ symptom:'', cause:'', action:'' } }, max = { values:40, steps:60, errors:30 };
    if(!f || !Object.prototype.hasOwnProperty.call(blank, kind) || f.draft[kind].length>=max[kind]) return; f.draft[kind].push(Object.assign({}, blank[kind])); render();
  },
  libFormRemove(kind, i){ const f = libraryForm; if(!f || !(kind==='values'||kind==='steps'||kind==='errors') || !Array.isArray(f.draft[kind])) return; f.draft[kind].splice(+i, 1); render(); },
  libFormToggleProduct(pid){ const f = libraryForm; if(!f || !PRODUCTS.some(x=>x.id===pid)) return; const a = f.draft.products; f.draft.products = a.indexOf(pid)>=0 ? a.filter(x=>x!==pid) : a.concat([pid]); },
  libFormDeclare(name){ const f = libraryForm; if(!f || !PH_NAME_RE.test(String(name)) || f.draft.values.length>=40 || f.draft.values.some(r=>r.name===name)) return; f.draft.values = f.draft.values.filter(r=>r.name || r.description || r.example).concat([{ name:String(name), description:'', example:'', source:'session' }]); render(); },
  testProcValue(pid, i, name, value){
    const t = (state.testCases[pid]||[])[i]; if(!t || !t.procId) return;
    const proc = loadLibrary().filter(q=>q.id===t.procId)[0], ph = proc && (proc.placeholders||[]).filter(x=>x.name===name)[0];
    if(!ph || ph.source!=='session' || phIsSecretName(name)) return;   // só placeholders "valor da sessão", e nunca de nome com cara de segredo
    const v = procClampStr(String(value==null ? '' : value), 200).replace(/[\r\n]+/g,' ').trim();
    if(!isPlainObject(t.procValues)) t.procValues = {};
    if(v) t.procValues[name] = v; else delete t.procValues[name];
    if(!Object.keys(t.procValues).length) delete t.procValues;
    saveState();
  },
  libOpen(id){ libraryOpenId = id; libraryNotice = null; render(); window.scrollTo(0,0); },
  libClose(){ const back = libraryReturnTo; libraryReturnTo = null; libraryOpenId = null; libraryNotice = null; if(back) go(back); else { render(); window.scrollTo(0,0); } },
  libLeave(){ libraryReturnTo = null; libraryOpenId = null; libraryNotice = null; libraryForm = null; go('dashboard'); },
  /* ---- vínculo teste ↔ procedimento ---- */
  procPick(pid, i){ procPicker = (procPicker && procPicker.pid===pid && procPicker.i===i) ? null : { pid:pid, i:i, query:'', all:false }; render(); },
  procPickClose(){ procPicker = null; render(); },
  procPickQuery(v){ if(procPicker){ procPicker.query = String(v).slice(0,80); render(); } },
  procPickAll(b){ if(procPicker){ procPicker.all = !!b; render(); } },
  testLinkProc(pid, i, procId){
    const t = state.testCases[pid] && state.testCases[pid][i], proc = loadLibrary().filter(q=>q.id===procId)[0]; if(!t || !proc) return;
    t.procId = proc.id; t.procVersion = proc.version; procPicker = null; saveState(); render();
  },
  testUnlinkProc(pid, i){
    const t = state.testCases[pid] && state.testCases[pid][i]; if(!t) return;
    t.procId = ''; t.procVersion = 0; saveState(); render();
  },
  testOpenProc(procId){ if(!loadLibrary().some(q=>q.id===procId)) return; libraryReturnTo = 'tests'; libraryOpenId = procId; libraryNotice = null; go('library'); },
  draftGenerate: generateProcedureDraft,
  libDelete(id){
    const p = loadLibrary().filter(x=>x.id===id)[0]; if(!p) return;
    if(!confirm(({pt:'Excluir este procedimento da biblioteca?',en:'Delete this procedure from the library?',es:'¿Eliminar este procedimiento de la biblioteca?'})[state.lang] + '\n' + p.title + ' v' + p.version)) return;
    saveLibrary(loadLibrary().filter(x=>x.id!==id)); if(libraryOpenId===id) libraryOpenId = null; libraryNotice = null; render();
  },
  libSet(id, key, value){
    if(['title','sourceClient','date','status','tags'].indexOf(key)<0) return;
    const list = loadLibrary(), p = list.filter(x=>x.id===id)[0]; if(!p) return;
    if(key==='tags') p.tags = String(value).split(',').map(t=>procClampStr(t.trim(),40)).filter((t,i,a)=>t && a.indexOf(t)===i).slice(0,30);
    else { const n = procNormalize(Object.assign({}, p, {[key]:value}), false); p[key] = n[key]; }
    const err = saveLibrary(list); if(err){ libraryNotice = { kind:'warn', text:err==='quota' ? libraryQuotaText() : libraryErrorText() }; render(); }
  },
  libToggleProduct(id, pid){
    const list = loadLibrary(), p = list.filter(x=>x.id===id)[0]; if(!p || !PRODUCTS.some(x=>x.id===pid)) return;
    p.products = p.products.indexOf(pid)>=0 ? p.products.filter(x=>x!==pid) : p.products.concat([pid]);
    const err = saveLibrary(list); if(err){ libraryNotice = { kind:'warn', text:err==='quota' ? libraryQuotaText() : libraryErrorText() }; render(); }
  },
  libImportHtml(input){
    const files = Array.prototype.slice.call(input.files||[]); input.value = '';
    Promise.all(files.map(f=>new Promise(resolve=>{ const r = new FileReader(); r.onload = ()=>resolve({name:f.name, text:String(r.result)}); r.onerror = ()=>resolve({name:f.name, text:null}); r.readAsText(f); })))
      .then(entries=>{ libraryNotice = libraryImportNotice(libraryImportHtmlFiles(entries)); render(); });
  },
  libImportJson(input){
    const f = input.files && input.files[0]; input.value = ''; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ let data = null; try{ data = JSON.parse(String(r.result)); }catch(e){}
      libraryNotice = libraryImportDataNotice(data===null ? { added:0, skipped:0, invalid:1, notLibrary:true } : libraryImportData(data)); render(); };
    r.onerror = ()=>{ libraryNotice = { kind:'warn', text:libraryErrorText() }; render(); };
    r.readAsText(f);
  },
  libExport(){
    const blob = new Blob([JSON.stringify(libraryExportObject(), null, 2)], {type:'application/json'}), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'procedimentos-biblioteca.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  },
  toggleProduct(id){ state.selectedProducts[id] = !state.selectedProducts[id]; saveState(); render(); },
  addContact(){ state.project.contacts.push({name:'',role:'',email:'',phone:''}); saveState(); render(); },
  removeContact(i){ state.project.contacts.splice(i,1); if(!state.project.contacts.length) state.project.contacts.push({name:'',role:'',email:'',phone:''}); saveState(); render(); },
  setVmField(i,key,value){ state.network.vms[i][key]=value; saveState(); },
  bulkCopyVmCreds(){
    if(!state.network.vms.length) return;
    const { user, password } = state.network.vms[0];
    state.network.vms.forEach(v => { v.user = user; v.password = password; });
    saveState(); render();
  },
  resetStep(){
    const keys = STEP_RESET_KEYS[state.view];
    if(!keys) return;
    if(!confirm(tr('common.resetStepConfirm'))) return;
    const def = defaultState();
    keys.forEach(k => { state[k] = def[k]; });
    saveState(); render();
  },
  addTest(productId){ if(!state.testCases[productId]) state.testCases[productId]=[]; state.testCases[productId].push({id:uid(), text:'', result:'pending', fit:'', led:'', owner:'', evidence:'', notes:''}); saveState(); render(); },
  addVmNetwork(){ state.virtNet.vmNetworks.push({name:'',vlan:'',uplink:''}); saveState(); render(); },
  addClientProduct(){ state.infra.manager.clientProducts.push({name:'',arch:''}); saveState(); render(); },
  removeListItem(path,i){
    if(['virtNet.vmNetworks','infra.manager.clientProducts'].indexOf(path)<0) return;
    getPath(state,path).splice(i,1); saveState(); render();
  },
  setInstallDone(id,checked){
    state.installProgress[id] = !!checked;
    if(checked) state.installDates[id] = todayISO(); else delete state.installDates[id];
    saveState(); render();
  },
  removeTest(productId,i){
    const t = state.testCases[productId][i];
    if(t && t.catalogId && state.testDismissed.indexOf(t.catalogId)<0) state.testDismissed.push(t.catalogId);   // não volta a ser semeado
    procPicker = null; state.testCases[productId].splice(i,1); saveState(); render();
  },
  setTestField(productId,i,key,value,rerender){
    const t = state.testCases[productId] && state.testCases[productId][i]; if(!t) return;
    const allowed = { evidence:()=>String(value), notes:()=>String(value), owner:()=>String(value).slice(0,120),
      priority:()=>(value==='must'||value==='nice') ? value : null, fit:()=>(value===''||TEST_FIT[value]) ? value : null, led:()=>(value===''||TEST_LED[value]) ? value : null,
      result:()=>TEST_STATUS[value] ? value : null };
    if(!allowed[key]) return;
    const v = allowed[key](); if(v===null) return;
    t[key] = v; if(key==='fit'){ delete t.fitSource; delete t.fitSuggestion; }
    saveState(); if(rerender) render();
  },
  execEnable,
  execUnlink(){ state.pocControlId = ''; execCheck = { id:'', status:'unknown' }; saveState(); render(); },
  srvProcLoad: serverProcsLoad,
  srvProcOpen: serverProcOpen,
  impOpen(){ importReset(); go('import'); },
  impCancel(){ importReset(); go('dashboard'); },
  impBack(){ importFlow.phase='form'; importFlow.items=[]; importFlow.accepted={}; render(); },
  impFile(input){ importFlow.file = (input.files && input.files[0]) || null; },
  impText(v){ importFlow.text = String(v||''); },
  impSend: importSend,
  impToggle(key){ importFlow.accepted[key] = !importFlow.accepted[key]; render(); },
  impCommit: importCommit,
  fitSuggest(pid,i){ suggestFitWeb(pid,i); },
  fitHistory(){ suggestFitHistory(); },
  fitAccept(pid,i){ const t=(state.testCases[pid]||[])[i]; if(!t || !t.fitSuggestion || !TEST_FIT[t.fitSuggestion.fit]) return; t.fit=t.fitSuggestion.fit; t.fitSource=t.fitSuggestion.source==='history' ? 'history' : 'web'; delete t.fitSuggestion; saveState(); render(); },
  fitDismiss(pid,i){ const t=(state.testCases[pid]||[])[i]; if(!t) return; delete t.fitSuggestion; saveState(); render(); },
  suggestUser(path){ const v=suggestUsername(path); if(v && USER_SUGGEST[path] && getPath(state,path)==='admin'){ setPath(state,path,v); saveState(); render(); } },
  setTestText(productId,i,value){ state.testCases[productId][i].text=value; saveState(); },
  setTestResult(productId,i,result){ if(!TEST_STATUS[result]) return; state.testCases[productId][i].result=result; saveState(); render(); },
  setTestFilter(key,value){ syncTestFilters(); if(key in testFilters){ testFilters[key]=String(value||''); saveTestFilters(); } },
  setTestFilterAndRender(key,value){ this.setTestFilter(key,value); render(); },
  clearTestFilters(){ syncTestFilters(); testFilters = { status:'', fit:'', led:'', owner:'', prio:'' }; saveTestFilters(); render(); },
  togglePort(key){ state.ports.checked[key] = !state.ports.checked[key]; saveState(); render(); },
  newProject(){
    if(confirm(tr('dashboard.resetWarn'))){ createNewProject(); render(); }
  },
  switchProject(id){
    if(id===activeProjectId) return;
    switchToProject(id); render(); window.scrollTo(0,0);
  },
  deleteProject(id){
    if(confirm(tr('projects.deleteConfirm'))){ deleteProjectById(id); render(); }
  },
  /* As folhas existem na tela de Resumo; de outra etapa, vai para lá antes de imprimir. */
  printMode(cls){
    if(state.view!=='summary'){ setView('summary'); saveState(); render(); }
    if(!cls){ window.print(); return; }
    document.body.classList.add(cls);
    const done = () => { document.body.classList.remove(cls); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
  },
  printReport(){ P.printMode(''); },
  printInstall(){ P.printMode('print-install'); },
  printOperatorSheet(){ P.printMode('print-operator'); },
  printDay(){ P.printMode('print-day'); },
  testToday(pid, i, checked){
    const t = state.testCases[pid] && state.testCases[pid][i]; if(!t) return;
    if(checked) t.today = true; else delete t.today;
    saveState(); render();
  },
  testTodayShown(){
    PRODUCTS.forEach(p=>{ if(state.selectedProducts[p.id] && state.testCases[p.id]) orderedTests(p.id).forEach(x=>{ if(testMatchesFilter(x.t)) x.t.today = true; }); });
    saveState(); render();
  },
  testTodayClear(){ Object.keys(state.testCases).forEach(id=>(state.testCases[id]||[]).forEach(t=>{ delete t.today; })); saveState(); render(); },
  exportProject(){
    const blob = new Blob([JSON.stringify(buildExportJson(),null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.project.projectName || 'suse-poc') + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  exportProjectSafe(){
    const blob = new Blob([JSON.stringify(buildSafeExportJson(),null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (state.project.projectName || 'suse-poc') + '-sem-segredos.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  importProject(input){
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const imported = normalizeLoadedState(e.target.result);
        if(!imported) throw new Error('invalid');
        state = imported;
        saveState(); render();
      }catch(err){ alert(tr('common.invalidFile')); }
    };
    reader.readAsText(file);
  }
};

/* Quem abre o planejador (a casca do poc-control, um iframe, um link) pode sugerir o idioma com ?lang=pt|en|es. Vale uma vez:
   o parâmetro é retirado do endereço, então recarregar não desfaz a escolha que a pessoa fizer depois no seletor. */
function langFromUrl(search){
  const m = /[?&]lang=([a-z-]{2,5})(?:&|$)/i.exec(String(search||''));
  if(!m) return null;
  const v = m[1].slice(0,2).toLowerCase();
  return ['pt','en','es'].indexOf(v)>=0 ? v : null;
}
function applyUrlLang(){
  if(typeof location==='undefined') return;
  const v = langFromUrl(location.search); if(!v) return;
  if(state.lang!==v){ state.lang = v; saveState(); }
  try{ const u = new URL(location.href); u.searchParams.delete('lang'); history.replaceState(null,'',u.pathname+(u.search||'')+u.hash); }catch(e){}
}
document.addEventListener('DOMContentLoaded', function(){ applyUrlLang(); render(); });
document.addEventListener('DOMContentLoaded', connectorProbe);
</script>
